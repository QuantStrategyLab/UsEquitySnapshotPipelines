name: Alpaca SIP Access Diagnostic

on:
  workflow_dispatch:
    inputs:
      diagnostic_mode:
        description: Existing access classification or one fixed SOXL three-day probe.
        required: true
        default: access
        type: choice
        options:
          - access
          - soxl-three-day
      date_cutoff:
        description: Exact YYYY-MM-DD cutoff to compare with a daily P1 request.
        required: true
        type: string

concurrency:
  group: alpaca-sip-access-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify-sip-access:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Classify explicit historical and recent feed segments
        if: inputs.diagnostic_mode == 'access' || inputs.diagnostic_mode == ''
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          DATE_CUTOFF: ${{ inputs.date_cutoff }}
          ALPACA_SIP_MIN_DELAY_MINUTES: ${{ vars.ALPACA_SIP_MIN_DELAY_MINUTES || '16' }}
          ALPACA_FEED_HISTORICAL: ${{ vars.ALPACA_FEED_HISTORICAL || 'sip' }}
          ALPACA_FEED_RECENT: ${{ vars.ALPACA_FEED_RECENT || 'iex' }}
        run: python scripts/alpaca_access_diagnostic.py
      - name: Probe fixed SOXL three-day schema once
        if: inputs.diagnostic_mode == 'soxl-three-day'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          DATE_CUTOFF: ${{ inputs.date_cutoff }}
        run: python scripts/alpaca_soxl_three_day_probe.py
      - name: Upload sanitized diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-access-diagnostic
          path: diagnostic.json
          if-no-files-found: error
          retention-days: 14
