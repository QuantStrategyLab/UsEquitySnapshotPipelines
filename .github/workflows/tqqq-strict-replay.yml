name: TQQQ Strict Replay (research)

# Pre-registered 2026-11-27 (docs/research/tqqq-strict-replay.md).
# Research only: public adjusted prices, no credentials, no orders, nothing published.
on:
  workflow_dispatch:
    inputs:
      end_date:
        description: Last price date (YYYY-MM-DD), within the merged research mandate
        required: true
        type: string
      tax_rate:
        description: Optional annual gain tax rate in [0, 1] (empty uses env/default 0.0)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: tqqq-strict-replay
  cancel-in-progress: false

jobs:
  compare:
    # Only the reviewed record on the protected branch can authorize provider access.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Install the pinned strategy source for this study only
        # The study replays tqqq_growth_income at the exact reviewed commit named in the research
        # mandate; the project's own dependency pin is unchanged.
        run: |
          set -euo pipefail
          uv pip install --no-deps \
            "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@1fcfeac3dfad95db6b70ed3af19ce49c62f2c3ef"
          uv run --no-sync python -c "import us_equity_strategies.strategies.tqqq_growth_income"
      - name: Run the pre-registered comparison
        env:
          END_DATE: ${{ inputs.end_date }}
          TAX_RATE: ${{ inputs.tax_rate }}
        run: |
          set -euo pipefail
          [[ "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "invalid end_date"; exit 2; }
          args=(--output-dir out --end-date "$END_DATE")
          if [ -n "$TAX_RATE" ]; then
            [[ "$TAX_RATE" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "invalid tax_rate"; exit 2; }
            args+=(--tax-rate "$TAX_RATE")
          fi
          uv run --no-sync python -m us_equity_snapshot_pipelines.research.tqqq_strict_replay "${args[@]}"
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tqqq-strict-replay
          path: out/
          retention-days: 30
