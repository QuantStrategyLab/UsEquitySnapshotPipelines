name: SOXL V7 R6 Twelve Single Source Research

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Exact private-store preflight, frozen R6 execution, metadata, integrity, contracts, materialized identity, or RAW manifest projection
        required: true
        type: choice
        options:
          - preflight
          - execute
          - metadata_only
          - integrity_only
          - contracts_only
          - materialized_identity_only
          - raw_manifest_projection_only

permissions:
  contents: read
  id-token: write

concurrency:
  group: soxl-v7-r6-twelve-single-source
  cancel-in-progress: false

jobs:
  r6-research:
    if: ${{ inputs.mode == 'preflight' || inputs.mode == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked research runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Authenticate existing non-live research identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Verify private create-only write and fixed-version read
        if: inputs.mode == 'preflight'
        timeout-minutes: 10
        env:
          SOXL_V7_R6_PRIVATE_ROOT: ${{ secrets.SOXL_V7_R6_PRIVATE_ROOT }}
        run: uv run --no-sync python -m scripts.soxl_v7_r6_twelve_single_source preflight
      - name: Fetch frozen UES source for unchanged V7 replay
        if: inputs.mode == 'execute'
        run: |
          set -euo pipefail
          ues="${RUNNER_TEMP}/soxl-v7-r6-ues"
          git clone --quiet --no-checkout https://github.com/QuantStrategyLab/UsEquityStrategies.git "$ues"
          git -C "$ues" fetch --quiet --depth=1 origin 07b164d95f2ab4d4c54fd993f6f2040bd207d664
          git -C "$ues" checkout --quiet --detach 07b164d95f2ab4d4c54fd993f6f2040bd207d664
      - name: Run one R6 source acquisition and fixed replay
        if: inputs.mode == 'execute'
        env:
          SOXL_V7_R6_PRIVATE_ROOT: ${{ secrets.SOXL_V7_R6_PRIVATE_ROOT }}
          SOXL_V7_R6_LICENSE_EVIDENCE_SHA256: ${{ secrets.SOXL_V7_R6_LICENSE_EVIDENCE_SHA256 }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          uv run --no-sync python -m scripts.soxl_v7_r6_twelve_single_source execute \
            --ues-project "${RUNNER_TEMP}/soxl-v7-r6-ues" \
            --license-evidence-sha256 "${SOXL_V7_R6_LICENSE_EVIDENCE_SHA256}"

  research-input-archive-metadata:
    if: ${{ inputs.mode == 'metadata_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked research runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Authenticate existing non-live research identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Read research input archive metadata only
        env:
          SOXL_V7_R6_PRIVATE_ROOT: ${{ secrets.SOXL_V7_R6_PRIVATE_ROOT }}
        run: |
          set -euo pipefail
          set +e
          timeout 30s uv run --no-sync python -m scripts.read_research_input_archive_metadata 2>/dev/null
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '%s\n' '{"status":"TIMEOUT","reason_class":"DEADLINE_EXCEEDED","research_qualification":false,"trading_rights":false,"content_verified":false}'
            exit 2
          fi
          exit "$code"

  research-input-archive-integrity:
    if: ${{ inputs.mode == 'integrity_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked research runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Authenticate existing non-live research identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Verify research input archive integrity only
        env:
          SOXL_V7_R6_PRIVATE_ROOT: ${{ secrets.SOXL_V7_R6_PRIVATE_ROOT }}
        run: |
          set -euo pipefail
          set +e
          timeout 30s uv run --no-sync python -m scripts.read_research_input_archive_metadata --integrity-only 2>/dev/null
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '%s\n' '{"status":"TIMEOUT","reason_class":"DEADLINE_EXCEEDED","research_qualification":false,"trading_rights":false,"content_verified":false,"content_integrity_verified":false}'
            exit 2
          fi
          exit "$code"

  research-input-archive-contracts:
    if: ${{ inputs.mode == 'contracts_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked research runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Authenticate existing non-live research identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Verify research input archive contracts only
        run: |
          set -euo pipefail
          set +e
          timeout 30s uv run --no-sync python -m scripts.read_research_input_archive_metadata --contracts-only 2>/dev/null
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '%s\n' '{"status":"TIMEOUT","reason_class":"DEADLINE_EXCEEDED","research_qualification":false,"trading_rights":false,"content_verified":false,"contracts_integrity_verified":false}'
            exit 2
          fi
          exit "$code"

  research-input-archive-raw-manifest-projection:
    if: ${{ inputs.mode == 'raw_manifest_projection_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked research runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Authenticate existing non-live research identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Verify research input archive RAW manifest projection only
        run: |
          set -euo pipefail
          set +e
          timeout 30s uv run --no-sync python -m scripts.read_research_input_archive_metadata --raw-manifest-projection-only 2>/dev/null
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '%s\n' '{"status":"TIMEOUT","reason_class":"DEADLINE_EXCEEDED","research_qualification":false,"trading_rights":false,"license_verified":false,"historical_point_in_time_certified":false,"completion_identity_authenticated":false,"content_verified":false,"content_integrity_verified":false,"manifest_identity_matched":false,"member_body_read":false,"member_content_verified":false}'
            exit 2
          fi
          exit "$code"

  research-input-archive-materialized-identity:
    if: ${{ inputs.mode == 'materialized_identity_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Prepare legacy source and locked venv
        id: prep
        run: |
          set -euo pipefail
          TASK="${RUNNER_TEMP}/qsl-materialized-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$TASK"
          SRC="$TASK/source"
          VENV="$TASK/venv"
          CACHE="$TASK/cache"
          mkdir -m 700 "$SRC" "$CACHE"
          mkdir -m 700 "$CACHE/tmp" "$CACHE/xdg" "$CACHE/mpl" "$CACHE/uv" "$CACHE/pip"
          export TMPDIR="$CACHE/tmp"
          export XDG_CACHE_HOME="$CACHE/xdg"
          export MPLCONFIGDIR="$CACHE/mpl"
          export UV_CACHE_DIR="$CACHE/uv"
          export PIP_CACHE_DIR="$CACHE/pip"
          LEGACY_SHA="0ae8ac4eb886431f9f9695702d9dd60982919dae"
          LOCK_SHA="56f837bdf65342ebff4e59f8dd3b5f2e351dbb064ca0e1f46204827c50f1afc8"
          set +e
          timeout --kill-after=10s 300s bash -c "
            set -euo pipefail
            git fetch --no-tags --depth=1 origin ${LEGACY_SHA}
            git archive --format=tar ${LEGACY_SHA} | tar -x -C \"${SRC}\"
            printf '%s\n' '${LEGACY_SHA}' > \"${TASK}/source_commit\"
          " >/dev/null 2>&1
          src_code=$?
          set -e
          if [ "$src_code" -eq 124 ] || [ "$src_code" -eq 137 ]; then
            printf '%s\n' '{"status":"BLOCKED","reason_class":"SOURCE_PREPARE_TIMEOUT","research_qualification":false,"trading_rights":false,"content_verified":false,"materialized_identity_matched":false}'
            exit 2
          fi
          if [ "$src_code" -ne 0 ]; then
            printf '%s\n' '{"status":"BLOCKED","reason_class":"SOURCE_PREPARE_FAILED","research_qualification":false,"trading_rights":false,"content_verified":false,"materialized_identity_matched":false}'
            exit 2
          fi
          if [ ! -f "$SRC/uv.lock" ]; then
            printf '%s\n' '{"status":"BLOCKED","reason_class":"RUNTIME_LOCK_UNAVAILABLE","research_qualification":false,"trading_rights":false,"content_verified":false,"materialized_identity_matched":false}'
            exit 2
          fi
          observed_lock="$(sha256sum "$SRC/uv.lock" | awk '{print $1}')"
          if [ "$observed_lock" != "$LOCK_SHA" ]; then
            printf '%s\n' '{"status":"BLOCKED","reason_class":"RUNTIME_LOCK_MISMATCH","research_qualification":false,"trading_rights":false,"content_verified":false,"materialized_identity_matched":false}'
            exit 2
          fi
          set +e
          timeout --kill-after=10s 600s bash -c "
            set -euo pipefail
            python -m pip install --quiet 'uv==0.11.19'
            uv_ver=\"\$(env -u VIRTUAL_ENV python -I -m uv self version --short)\"
            if [ \"\$uv_ver\" != '0.11.19' ]; then
              exit 3
            fi
            cd \"${SRC}\"
            env -u UV_PYTHON -u VIRTUAL_ENV UV_PROJECT_ENVIRONMENT=\"${VENV}\" \
              UV_CACHE_DIR=\"${CACHE}/uv\" PIP_CACHE_DIR=\"${CACHE}/pip\" \
              TMPDIR=\"${CACHE}/tmp\" XDG_CACHE_HOME=\"${CACHE}/xdg\" MPLCONFIGDIR=\"${CACHE}/mpl\" \
              python -I -m uv sync --locked --no-dev --no-editable --python 3.11
          " >/dev/null 2>&1
          lock_code=$?
          set -e
          if [ "$lock_code" -eq 124 ] || [ "$lock_code" -eq 137 ]; then
            printf '%s\n' '{"status":"BLOCKED","reason_class":"LOCK_RESTORE_TIMEOUT","research_qualification":false,"trading_rights":false,"content_verified":false,"materialized_identity_matched":false}'
            exit 2
          fi
          if [ "$lock_code" -eq 3 ]; then
            printf '%s\n' '{"status":"BLOCKED","reason_class":"UV_VERSION_MISMATCH","research_qualification":false,"trading_rights":false,"content_verified":false,"materialized_identity_matched":false}'
            exit 2
          fi
          if [ "$lock_code" -ne 0 ] || [ ! -x "$VENV/bin/python" ]; then
            printf '%s\n' '{"status":"BLOCKED","reason_class":"LOCK_RESTORE_FAILED","research_qualification":false,"trading_rights":false,"content_verified":false,"materialized_identity_matched":false}'
            exit 2
          fi
          {
            echo "task_root=$TASK"
            echo "source_dir=$SRC"
            echo "venv_python=$VENV/bin/python"
            echo "source_commit=$LEGACY_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Authenticate existing non-live research identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Verify research input archive materialized identity
        env:
          SOXL_V7_R6_PRIVATE_ROOT: ${{ secrets.SOXL_V7_R6_PRIVATE_ROOT }}
          QSL_MATERIALIZED_TASK_ROOT: ${{ steps.prep.outputs.task_root }}
          QSL_MATERIALIZED_SOURCE_DIR: ${{ steps.prep.outputs.source_dir }}
          QSL_MATERIALIZED_VENV_PYTHON: ${{ steps.prep.outputs.venv_python }}
          QSL_MATERIALIZED_SOURCE_COMMIT: ${{ steps.prep.outputs.source_commit }}
          TMPDIR: ${{ steps.prep.outputs.task_root }}/cache/tmp
          XDG_CACHE_HOME: ${{ steps.prep.outputs.task_root }}/cache/xdg
          MPLCONFIGDIR: ${{ steps.prep.outputs.task_root }}/cache/mpl
          UV_CACHE_DIR: ${{ steps.prep.outputs.task_root }}/cache/uv
          PIP_CACHE_DIR: ${{ steps.prep.outputs.task_root }}/cache/pip
        run: |
          set -euo pipefail
          set +e
          timeout 150s "${QSL_MATERIALIZED_VENV_PYTHON}" -m scripts.read_research_input_archive_metadata --materialized-identity-only 2>/dev/null
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '%s\n' '{"status":"TIMEOUT","reason_class":"DEADLINE_EXCEEDED","research_qualification":false,"trading_rights":false,"content_verified":false,"materialized_identity_matched":false}'
            exit 2
          fi
          exit "$code"
      - name: Cleanup materialized identity task directory
        if: always()
        run: |
          set -euo pipefail
          TASK="${RUNNER_TEMP}/qsl-materialized-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          timeout 60s rm -rf -- "$TASK" >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            printf '%s\n' '{"status":"BLOCKED","reason_class":"TASK_CLEANUP_FAILED","research_qualification":false,"trading_rights":false,"content_verified":false,"materialized_identity_matched":false}'
            exit 2
          fi
