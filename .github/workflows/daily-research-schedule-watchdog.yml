name: Daily Research Schedule Watchdog

on:
  schedule:
    # Tue--Sat UTC. TQQQ P1 can use the default six-hour Actions job window,
    # and scheduled runs can be queued; check after that bounded window rather
    # than treating an in-progress research run as a failed schedule.
    # This only reports availability; it never starts or retries research.
    - cron: '20 11 * * 2-6'

concurrency:
  group: daily-research-schedule-watchdog
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Fetch scheduled workflow metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tqqq-p1-p3-daily-research.yml/runs?event=schedule&per_page=20" > "$RUNNER_TEMP/tqqq-scheduled-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/soxl-p1-p3-daily-research.yml/runs?event=schedule&per_page=20" > "$RUNNER_TEMP/soxl-scheduled-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/soxl-v7-nonlive-forward-observation.yml/runs?event=schedule&per_page=20" > "$RUNNER_TEMP/soxl-v7-scheduled-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tqqq-v9-free-ohlcv-assurance-calibration.yml/runs?event=schedule&per_page=20" > "$RUNNER_TEMP/tqqq-v9-assurance-scheduled-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-research-schedule-watchdog.yml/runs?event=schedule&per_page=20" > "$RUNNER_TEMP/watchdog-scheduled-runs.json"
      - name: Report late, missing, or failed scheduled research
        run: |
          set -euo pipefail
          current_weekday="$(date -u +%u)"
          if [ "$current_weekday" = '2' ]; then
            watchdog_expected_date="$(date -u -d '3 days ago' +%F)"
          else
            watchdog_expected_date="$(date -u -d '1 day ago' +%F)"
          fi
          uv run --no-sync python scripts/check_daily_research_schedule_watchdog.py \
            --expected-utc-date "$(date -u +%F)" \
            --tqqq-workflow-runs "$RUNNER_TEMP/tqqq-scheduled-runs.json" \
            --soxl-workflow-runs "$RUNNER_TEMP/soxl-scheduled-runs.json" \
            --soxl-v7-workflow-runs "$RUNNER_TEMP/soxl-v7-scheduled-runs.json" \
            --tqqq-v9-assurance-workflow-runs "$RUNNER_TEMP/tqqq-v9-assurance-scheduled-runs.json" \
            --watchdog-workflow-runs "$RUNNER_TEMP/watchdog-scheduled-runs.json" \
            --watchdog-expected-utc-date "$watchdog_expected_date" \
            | tee "$RUNNER_TEMP/daily-research-schedule-watchdog.json"
          cat "$RUNNER_TEMP/daily-research-schedule-watchdog.json" >> "$GITHUB_STEP_SUMMARY"
