name: Daily Research Schedule Watchdog

on:
  schedule:
    # Tue--Sat UTC. This runs well after both scheduled P1--P3 research jobs,
    # and only reports availability; it never starts or retries research.
    - cron: '20 4 * * 2-6'

concurrency:
  group: daily-research-schedule-watchdog
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch scheduled workflow metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tqqq-p1-p3-daily-research.yml/runs?event=schedule&per_page=20" > "$RUNNER_TEMP/tqqq-scheduled-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/soxl-p1-p3-daily-research.yml/runs?event=schedule&per_page=20" > "$RUNNER_TEMP/soxl-scheduled-runs.json"
      - name: Report late, missing, or failed scheduled research
        run: |
          set -euo pipefail
          python scripts/check_daily_research_schedule_watchdog.py \
            --expected-utc-date "$(date -u +%F)" \
            --tqqq-workflow-runs "$RUNNER_TEMP/tqqq-scheduled-runs.json" \
            --soxl-workflow-runs "$RUNNER_TEMP/soxl-scheduled-runs.json" \
            | tee "$RUNNER_TEMP/daily-research-schedule-watchdog.json"
          cat "$RUNNER_TEMP/daily-research-schedule-watchdog.json" >> "$GITHUB_STEP_SUMMARY"
