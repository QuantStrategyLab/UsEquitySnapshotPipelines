name: Portfolio Candidate Readiness

on:
  schedule:
    # Run after the daily-workflow watchdog. This aggregates only sanitized
    # terminal artifacts; it never triggers, retries, or waits on research.
    - cron: '35 11 * * 2-6'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: portfolio-candidate-readiness
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    outputs:
      terminal_artifacts_available: ${{ steps.artifacts.outputs.available }}
      status: ${{ steps.readiness.outputs.status }}
      proposal_id: ${{ steps.readiness.outputs.proposal_id }}
      readiness_sha256: ${{ steps.readiness.outputs.readiness_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Download latest sanitized terminal artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/portfolio-candidate-readiness"
          mkdir -p "$root/tqqq" "$root/soxl"
          latest_scheduled_run_with_artifact() {
            local workflow="$1"
            local artifact_prefix="$2"
            local run_id
            while IFS= read -r run_id; do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                --jq "any(.artifacts[]; (.expired | not) and (.name | startswith(\"${artifact_prefix}\")))" \
                | grep -qx true; then
                printf '%s\n' "$run_id"
                return 0
              fi
            done < <(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event schedule \
                --status completed --limit 20 --json databaseId,conclusion \
                --jq '.[] | select(.conclusion == "success") | .databaseId'
            )
          }
          tqqq_run="$(latest_scheduled_run_with_artifact tqqq-p1-p3-daily-research.yml tqqq-p1-terminal-)"
          soxl_run="$(latest_scheduled_run_with_artifact soxl-p1-p3-daily-research.yml soxl-p1-terminal-)"
          if [ -z "$tqqq_run" ] || [ -z "$soxl_run" ]; then
            echo 'No completed daily terminal artifact pair is available yet.' >> "$GITHUB_STEP_SUMMARY"
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          download_required_terminal() {
            local run_id="$1"
            local pattern="$2"
            local destination="$3"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern "$pattern" --dir "$destination"; then
              echo "Required terminal artifact is unavailable: run=${run_id}, pattern=${pattern}" >> "$GITHUB_STEP_SUMMARY"
              echo 'available=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          }
          download_required_terminal "$tqqq_run" 'tqqq-p1-terminal-*' "$root/tqqq"
          download_required_terminal "$soxl_run" 'soxl-p1-terminal-*' "$root/soxl"
          gh run download "$tqqq_run" --repo "$GITHUB_REPOSITORY" --pattern 'tqqq-p3-terminal-*' --dir "$root/tqqq" || true
          gh run download "$soxl_run" --repo "$GITHUB_REPOSITORY" --pattern 'soxl-p3-terminal-*' --dir "$root/soxl" || true
          tqqq_p1="$(find "$root/tqqq" -type f -name p1-terminal-status.json -print -quit)"
          soxl_p1="$(find "$root/soxl" -type f -name p1-status.json -print -quit)"
          if [ -z "$tqqq_p1" ] || [ -z "$soxl_p1" ]; then
            echo 'Required P1 terminal artifact was unavailable.' >> "$GITHUB_STEP_SUMMARY"
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tqqq_p1=$tqqq_p1" >> "$GITHUB_OUTPUT"
          echo "soxl_p1=$soxl_p1" >> "$GITHUB_OUTPUT"
          echo "tqqq_p3=$(find "$root/tqqq" -type f -name daily-research-status.json -print -quit)" >> "$GITHUB_OUTPUT"
          echo "soxl_p3=$(find "$root/soxl" -type f -name p3-summary.json -print -quit)" >> "$GITHUB_OUTPUT"
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Build sanitized portfolio readiness
        id: readiness
        if: steps.artifacts.outputs.available == 'true'
        env:
          TQQQ_P1: ${{ steps.artifacts.outputs.tqqq_p1 }}
          TQQQ_P3: ${{ steps.artifacts.outputs.tqqq_p3 }}
          SOXL_P1: ${{ steps.artifacts.outputs.soxl_p1 }}
          SOXL_P3: ${{ steps.artifacts.outputs.soxl_p3 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/portfolio-candidate-readiness"
          command=(uv run --no-sync python scripts/build_portfolio_candidate_readiness.py
            --tqqq-p1 "$TQQQ_P1" --soxl-p1 "$SOXL_P1"
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --output "$root/portfolio-candidate-readiness.json")
          if [ -n "$TQQQ_P3" ]; then command+=(--tqqq-p3 "$TQQQ_P3"); fi
          if [ -n "$SOXL_P3" ]; then command+=(--soxl-p3 "$SOXL_P3"); fi
          "${command[@]}"
          ROOT="$root" python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ['ROOT'], 'portfolio-candidate-readiness.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"status={result['status']}\n")
              output.write(f"proposal_id={result['proposal']['proposal_id']}\n")
              output.write(f"readiness_sha256={result['readiness_sha256']}\n")
          PY
      - name: Upload sanitized readiness record
        if: steps.artifacts.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-candidate-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portfolio-candidate-readiness/portfolio-candidate-readiness.json
          if-no-files-found: error
          retention-days: 35

  create-ai-research-task:
    needs: assess
    if: needs.assess.outputs.status == 'AI_RESEARCH_PROPOSAL_READY'
    runs-on: ubuntu-latest
    steps:
      - name: Create or update one bounded AI research task
        uses: actions/github-script@v8
        env:
          PROPOSAL_ID: ${{ needs.assess.outputs.proposal_id }}
          READINESS_SHA256: ${{ needs.assess.outputs.readiness_sha256 }}
        with:
          script: |
            const marker = `<!-- qsl-portfolio-candidate-readiness:${process.env.PROPOSAL_ID} -->`;
            const title = `AI research proposal ready: ${process.env.PROPOSAL_ID}`;
            const body = [
              marker,
              '## Sanitized readiness signal',
              `- Proposal: \`${process.env.PROPOSAL_ID}\``,
              `- Readiness digest: \`${process.env.READINESS_SHA256}\``,
              '',
              'Both registered components have completed their current P3 terminal records with one common cutoff.',
              '',
              '## Strict boundary',
              '- This is an AI research task only: it does not choose weights or freeze a P2 portfolio candidate.',
              '- It does not create P1 data, run a P3 replay, or authorize paper, shadow, live, accounts, or orders.',
              '- Any future candidate must independently bind common historical P1 inputs, costs, portfolio risk, and P2/P3 evidence.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && (issue.body || '').includes(marker));
            if (existing) {
              const digestLine = `- Readiness digest: \`${process.env.READINESS_SHA256}\``;
              if (!(existing.body || '').includes(digestLine)) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  title, body,
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }

  report-research-input-availability:
    needs: assess
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create, update, or resolve one research-input availability alert
        uses: actions/github-script@v8
        env:
          ASSESS_RESULT: ${{ needs.assess.result }}
          TERMINAL_ARTIFACTS_AVAILABLE: ${{ needs.assess.outputs.terminal_artifacts_available }}
          READINESS_STATUS: ${{ needs.assess.outputs.status }}
          READINESS_SHA256: ${{ needs.assess.outputs.readiness_sha256 }}
        with:
          script: |
            const marker = '<!-- qsl-portfolio-candidate-input-availability:v1 -->';
            const assessmentSucceeded = process.env.ASSESS_RESULT === 'success';
            const terminalArtifactsAvailable = process.env.TERMINAL_ARTIFACTS_AVAILABLE === 'true';
            const readinessStatus = process.env.READINESS_STATUS;
            const healthy = assessmentSucceeded
              && terminalArtifactsAvailable
              && readinessStatus === 'AI_RESEARCH_PROPOSAL_READY';
            let state = 'READINESS_WORKFLOW_FAILED';
            if (assessmentSucceeded && !terminalArtifactsAvailable) {
              state = 'TERMINAL_ARTIFACT_UNAVAILABLE';
            } else if (assessmentSucceeded && terminalArtifactsAvailable && !readinessStatus) {
              state = 'READINESS_RECORD_UNAVAILABLE';
            } else if (assessmentSucceeded && terminalArtifactsAvailable) {
              state = readinessStatus;
            }
            const title = 'Research input availability requires attention';
            const body = [
              marker,
              '## Sanitized research-control signal',
              `- State: \`${state}\``,
              `- Assessment job result: \`${process.env.ASSESS_RESULT || 'unknown'}\``,
              `- Terminal artifacts available: \`${process.env.TERMINAL_ARTIFACTS_AVAILABLE || 'false'}\``,
              `- Readiness status: \`${readinessStatus || 'unavailable'}\``,
              `- Readiness digest: \`${process.env.READINESS_SHA256 || 'unavailable'}\``,
              '',
              '## Strict boundary',
              '- This alert is research-only. It never retries data collection, changes a strategy, or authorizes paper, shadow, live accounts, or orders.',
              '- The scheduled research workflow remains the sole source of a new terminal record.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && (issue.body || '').includes(marker));
            if (healthy) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  state: 'closed',
                });
              }
              core.notice('Research input availability is healthy; any prior alert was resolved.');
            } else if (existing) {
              if (existing.title !== title || existing.body !== body) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  title, body,
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
