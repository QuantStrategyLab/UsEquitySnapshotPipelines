name: TQQQ P1-P3 One Shot

on:
  workflow_dispatch:
    inputs:
      mandate_id:
        description: Checked-in non-live scope record identifier
        required: true
        type: string

concurrency:
  group: tqqq-p1-p3-nonlive
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  p1:
    runs-on: ubuntu-latest
    environment: tqqq-p1-p3-nonlive
    outputs:
      manifest_sha256: ${{ steps.acquire.outputs.manifest_sha256 }}
      mandate_id: ${{ steps.mandate.outputs.mandate_id }}
      mandate_receipt_sha256: ${{ steps.mandate.outputs.mandate_receipt_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Resolve non-live scope record before P1 acquisition
        id: mandate
        env:
          MANDATE_ID: ${{ inputs.mandate_id }}
        run: |
          set -euo pipefail
          mandate_result="$(uv run --no-sync python scripts/verify_tqqq_p1_p3_mandate.py \
            --mandates-root config/tqqq_p1_p3_mandates \
            --mandate-id "$MANDATE_ID")"
          MANDATE_RESULT="$mandate_result" uv run --no-sync python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["MANDATE_RESULT"])
          if result.get("status") != "NONLIVE_SCOPE_RECORD_VERIFIED":
              raise SystemExit("non-live scope record verification failed")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"mandate_id={result['mandate_id']}\n")
              output.write(f"mandate_receipt_sha256={result['mandate_receipt_sha256']}\n")
          PY
          printf 'NONLIVE_SCOPE_RECORD_STATUS=VERIFIED\nMANDATE_ID=%s\n' "$MANDATE_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Acquire and verify P1 root
        id: acquire
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-p1-p3/p1-root"
          mkdir -p "$(dirname "$root")"
          manifest_sha256="$(ROOT="$root" uv run --no-sync python - <<'PY'
          import os
          import subprocess
          from datetime import UTC, datetime
          from scripts.acquire_tqqq_core_only_p1_inputs_alpaca import AlpacaSipHistoricalBarsProvider, AlpacaSipHttpTransport, publish_tqqq_core_only_p1_inputs

          producer = {
              "repository": "QuantStrategyLab/UsEquitySnapshotPipelines",
              "commit_sha": os.environ["GITHUB_SHA"],
              "tree_sha": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "tool": "tqqq_core_only_p1_alpaca_sip_acquisition",
              "tool_version": "v1",
          }
          provider = AlpacaSipHistoricalBarsProvider(
              AlpacaSipHttpTransport(os.environ["ALPACA_API_KEY_ID"], os.environ["ALPACA_API_SECRET_KEY"])
          )
          result = publish_tqqq_core_only_p1_inputs(
              provider,
              output_root=os.environ["ROOT"],
              observed_at=datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              producer=producer,
          )
          print(result["manifest_sha256"])
          PY
          )"
          ROOT="$root" MANIFEST_SHA256="$manifest_sha256" uv run --no-sync python - <<'PY'
          import os
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import verify_tqqq_core_only_input_root

          assert verify_tqqq_core_only_input_root(os.environ["ROOT"]) == os.environ["MANIFEST_SHA256"]
          PY
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"
          printf 'P1_STATUS=P1_DATA_ONLY_INPUTS_PUBLISHED\nP1_MANIFEST_SHA256=%s\n' "$manifest_sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Create-only upload of verified P1 root
        env:
          MANIFEST_SHA256: ${{ steps.acquire.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-p1-p3/p1-root"
          destination="gs://qsl-runtime-logs-shared/tqqq-p1-p3/${MANIFEST_SHA256}"
          if gcloud storage ls "${destination}/" >/dev/null 2>&1; then
            exit 1
          fi
          gcloud storage cp --quiet --no-clobber "$root/binding.json" "$root/bars.json" "$root/manifest.json" "${destination}/" >/dev/null
          printf 'P1_UPLOAD_STATUS=CREATE_ONLY_COMPLETE\nP1_MANIFEST_SHA256=%s\n' "$MANIFEST_SHA256" >> "$GITHUB_STEP_SUMMARY"

  p3:
    needs: p1
    runs-on: ubuntu-latest
    environment: tqqq-p1-p3-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Re-verify non-live scope record
        id: mandate
        env:
          MANDATE_ID: ${{ needs.p1.outputs.mandate_id }}
          EXPECTED_MANDATE_RECEIPT_SHA256: ${{ needs.p1.outputs.mandate_receipt_sha256 }}
        run: |
          set -euo pipefail
          mandate_result="$(uv run --no-sync python scripts/verify_tqqq_p1_p3_mandate.py \
            --mandates-root config/tqqq_p1_p3_mandates \
            --mandate-id "$MANDATE_ID")"
          MANDATE_RESULT="$mandate_result" EXPECTED_MANDATE_RECEIPT_SHA256="$EXPECTED_MANDATE_RECEIPT_SHA256" uv run --no-sync python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["MANDATE_RESULT"])
          if (
              result.get("status") != "NONLIVE_SCOPE_RECORD_VERIFIED"
              or result.get("mandate_receipt_sha256") != os.environ["EXPECTED_MANDATE_RECEIPT_SHA256"]
          ):
              raise SystemExit("non-live scope record verification failed")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"mandate_id={result['mandate_id']}\n")
              output.write(f"mandate_receipt_sha256={result['mandate_receipt_sha256']}\n")
          PY
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Download and verify the P1 root
        id: input
        env:
          MANIFEST_SHA256: ${{ needs.p1.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-p1-p3/p3-input"
          mkdir -p "$root"
          chmod 700 "$root"
          source="gs://qsl-runtime-logs-shared/tqqq-p1-p3/${MANIFEST_SHA256}"
          gcloud storage cp --quiet "$source/binding.json" "$source/bars.json" "$source/manifest.json" "$root/" >/dev/null
          chmod 700 "$root"
          ROOT="$root" MANIFEST_SHA256="$MANIFEST_SHA256" uv run --no-sync python - <<'PY'
          import os
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import verify_tqqq_core_only_input_root

          assert verify_tqqq_core_only_input_root(os.environ["ROOT"]) == os.environ["MANIFEST_SHA256"]
          PY
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          printf 'P3_INPUT_STATUS=VERIFIED\nP1_MANIFEST_SHA256=%s\n' "$MANIFEST_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - name: Run one non-live P3 replay
        id: replay
        env:
          SNAPSHOT_ROOT: ${{ steps.input.outputs.root }}
          MANDATE_RECEIPT_SHA256: ${{ steps.mandate.outputs.mandate_receipt_sha256 }}
        run: |
          set -euo pipefail
          result_path="${RUNNER_TEMP}/tqqq-p1-p3/p3-result.json"
          if ! uv run --no-sync python scripts/run_tqqq_p3.py \
            --snapshot-root "$SNAPSHOT_ROOT" \
            --config config/tqqq_core_only_p2_v1.json \
            --mandate-receipt-sha256 "$MANDATE_RECEIPT_SHA256" \
            --output-dir "${RUNNER_TEMP}/tqqq-p1-p3/p3-output" > "$result_path"; then
            RESULT_PATH="$result_path" uv run --no-sync python - <<'PY'
            import json
            import os

            with open(os.environ["RESULT_PATH"], encoding="utf-8") as handle:
                result = json.load(handle)
            expected_fields = {"complete_evidence", "failure_class", "replay_started", "source_commit", "stage", "status"}
            allowed_failure_classes = {
                "input_validation_failure",
                "config_contract_failure",
                "orchestrator_contract_failure",
                "risk_contract_failure",
                "evidence_validation_failure",
                "runtime_internal_failure",
            }
            allowed_stages = {"input_validation", "config_contract", "orchestrator_contract", "runtime"}
            if (
                set(result) != expected_fields
                or result.get("status") != "PARKED"
                or result.get("complete_evidence") is not False
                or result.get("failure_class") not in allowed_failure_classes
                or result.get("stage") not in allowed_stages
                or not isinstance(result.get("replay_started"), bool)
            ):
                raise SystemExit("invalid sanitized P3 failure result")
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                summary.write("P3_STATUS=PARKED\n")
                summary.write(f"P3_FAILURE_CLASS={result['failure_class']}\n")
                summary.write(f"P3_FAILURE_STAGE={result['stage']}\n")
                summary.write(f"P3_REPLAY_STARTED={str(result['replay_started']).lower()}\n")
            PY
            exit 1
          fi
          RESULT_PATH="$result_path" uv run --no-sync python - <<'PY'
          import json
          import os

          from us_equity_snapshot_pipelines.lifecycle.tqqq_p3_evidence_index import (
              validate_tqqq_p3_result,
          )

          with open(os.environ["RESULT_PATH"], encoding="utf-8") as handle:
              result = validate_tqqq_p3_result(json.load(handle))
          print(f"P3_STATUS={result['status']}")
          print(f"P3_EVIDENCE_SHA256={result['evidence_sha256']}")
          print(f"P3_VERDICT={result['verdict']}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"P3_STATUS={result['status']}\n")
              summary.write(f"P3_EVIDENCE_SHA256={result['evidence_sha256']}\n")
              summary.write(f"P3_VERDICT={result['verdict']}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in result.items():
                  output.write(f"{key}={value}\n")
          PY
      - name: Build validated P3 evidence index
        id: evidence-index
        env:
          SNAPSHOT_ROOT: ${{ steps.input.outputs.root }}
          P1_MANIFEST_SHA256: ${{ needs.p1.outputs.manifest_sha256 }}
          MANDATE_ID: ${{ steps.mandate.outputs.mandate_id }}
          MANDATE_RECEIPT_SHA256: ${{ steps.mandate.outputs.mandate_receipt_sha256 }}
          P3_EVIDENCE_SHA256: ${{ steps.replay.outputs.evidence_sha256 }}
          P3_STATUS: ${{ steps.replay.outputs.status }}
          P3_VERDICT: ${{ steps.replay.outputs.verdict }}
        run: |
          set -euo pipefail
          index_path="${RUNNER_TEMP}/tqqq-p1-p3/p3-evidence-index.json"
          INDEX_PATH="$index_path" SNAPSHOT_ROOT="$SNAPSHOT_ROOT" P1_MANIFEST_SHA256="$P1_MANIFEST_SHA256" P3_EVIDENCE_SHA256="$P3_EVIDENCE_SHA256" P3_STATUS="$P3_STATUS" P3_VERDICT="$P3_VERDICT" uv run --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          from us_equity_snapshot_pipelines.lifecycle.tqqq_p3_evidence_index import (
              build_tqqq_p3_evidence_index,
              canonical_tqqq_p3_evidence_index_bytes,
          )

          with open(Path(os.environ["SNAPSHOT_ROOT"]) / "manifest.json", encoding="utf-8") as handle:
              input_manifest = json.load(handle)
          index = build_tqqq_p3_evidence_index(
              p1_manifest_sha256=os.environ["P1_MANIFEST_SHA256"],
              nonlive_scope_record={
                  "mandate_id": os.environ["MANDATE_ID"],
                  "receipt_sha256": os.environ["MANDATE_RECEIPT_SHA256"],
              },
              p3_result={
                  "evidence_sha256": os.environ["P3_EVIDENCE_SHA256"],
                  "status": os.environ["P3_STATUS"],
                  "verdict": os.environ["P3_VERDICT"],
              },
              input_producer=input_manifest["producer"],
              producer={
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "commit_sha": os.environ["GITHUB_SHA"],
                  "tree_sha": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                  "tool": "tqqq_p1_p3_nonlive_evidence_index",
                  "tool_version": "v1",
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
          )
          path = Path(os.environ["INDEX_PATH"])
          path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
          path.write_bytes(canonical_tqqq_p3_evidence_index_bytes(index))
          path.chmod(0o600)
          PY
          printf 'path=%s\n' "$index_path" >> "$GITHUB_OUTPUT"
          printf 'P3_EVIDENCE_INDEX_STATUS=VALIDATED\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Create-only upload of validated P3 evidence index
        env:
          P1_MANIFEST_SHA256: ${{ needs.p1.outputs.manifest_sha256 }}
          P3_EVIDENCE_SHA256: ${{ steps.replay.outputs.evidence_sha256 }}
          INDEX_PATH: ${{ steps.evidence-index.outputs.path }}
        run: |
          set -euo pipefail
          destination="gs://qsl-runtime-logs-shared/tqqq-p1-p3/${P1_MANIFEST_SHA256}/p3-evidence-index/${P3_EVIDENCE_SHA256}.json"
          if gcloud storage ls "$destination" >/dev/null 2>&1; then
            exit 1
          fi
          gcloud storage cp --quiet --no-clobber "$INDEX_PATH" "$destination" >/dev/null
          printf 'P3_EVIDENCE_INDEX_UPLOAD_STATUS=CREATE_ONLY_COMPLETE\nP3_EVIDENCE_SHA256=%s\n' "$P3_EVIDENCE_SHA256" >> "$GITHUB_STEP_SUMMARY"
