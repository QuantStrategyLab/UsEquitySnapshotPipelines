name: SOXL Daily P1-P3 Research

on:
  schedule:
    # Tue--Sat UTC, after the preceding completed XNYS session. The calendar
    # resolver parks cleanly across US holidays.
    - cron: '45 2 * * 2-6'

concurrency:
  group: soxl-p1-p3-daily-research-v3
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  p1:
    runs-on: ubuntu-latest
    # This shared environment supplies non-live data credentials only. The
    # candidate/P1 binding below remains SOXL-specific and research-only.
    environment: market-data-nonlive
    outputs:
      date_cutoff: ${{ steps.acquire.outputs.date_cutoff }}
      manifest_sha256: ${{ steps.acquire.outputs.manifest_sha256 }}
      status: ${{ steps.acquire.outputs.status }}
      reason_code: ${{ steps.acquire.outputs.reason_code }}
      provider_retry_state: ${{ steps.acquire.outputs.provider_retry_state }}
      decision_projection_status: ${{ steps.decision_projection_terminal.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Acquire one candidate-bound daily P1 root or defer
        id: acquire
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/soxl-daily-research/p1-root"
          status_path="${RUNNER_TEMP}/soxl-daily-research/p1-status.json"
          mkdir -p "$(dirname "$root")"
          ROOT="$root" STATUS_PATH="$status_path" uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          from scripts.acquire_soxl_core_only_p1_inputs_alpaca import (
              AlpacaSipHistoricalBarsProvider,
              AlpacaSipHttpTransport,
              P1InputUnavailableError,
              publish_soxl_core_only_p1_inputs,
          )
          from us_equity_snapshot_pipelines.lifecycle.soxl_core_only_p1_binding import (
              SoxlCoreOnlyP1BindingError,
              resolve_soxl_core_only_daily_date_cutoff,
          )
          from us_equity_snapshot_pipelines.lifecycle.soxl_core_only_p1_publisher import (
              build_soxl_core_only_p1_remote_completion,
              canonical_soxl_core_only_p1_remote_completion_bytes,
          )
          from us_equity_snapshot_pipelines.lifecycle.soxl_core_only_p2_v3_contract import P2_V3_CONTRACT

          observed_at = datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          reference_day = (datetime.now(UTC).date() - timedelta(days=1)).isoformat()
          cutoff = resolve_soxl_core_only_daily_date_cutoff(reference_day)
          root = Path(os.environ['ROOT'])
          status_path = Path(os.environ['STATUS_PATH'])
          status = 'PARKED'
          reason_code = 'P1_CONTRACT_OR_RUNTIME_UNAVAILABLE'
          manifest_sha256 = ''
          provider_retry_state = 'NOT_TRIGGERED'
          transport = None
          try:
              transport = AlpacaSipHttpTransport(
                  os.environ['ALPACA_API_KEY_ID'], os.environ['ALPACA_API_SECRET_KEY']
              )
              provider = AlpacaSipHistoricalBarsProvider(transport, date_cutoff=cutoff)
              producer = {
                  'repository': 'QuantStrategyLab/UsEquitySnapshotPipelines',
                  'commit_sha': os.environ['GITHUB_SHA'],
                  'tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                  'tool': 'soxl_core_only_p1_alpaca_sip_daily_acquisition',
                  'tool_version': 'v3',
              }
              published = publish_soxl_core_only_p1_inputs(
                  provider,
                  output_root=root,
                  observed_at=observed_at,
                  producer=producer,
                  date_cutoff=cutoff,
              )
              manifest_sha256 = published['manifest_sha256']
              completion = build_soxl_core_only_p1_remote_completion(root)
              (root / 'p1-complete.json').write_bytes(
                  canonical_soxl_core_only_p1_remote_completion_bytes(completion)
              )
              status = 'ACCEPTED'
              reason_code = ''
          except P1InputUnavailableError as exc:
              status = 'DEFERRED'
              reason_code = exc.reason_code
          except SoxlCoreOnlyP1BindingError:
              pass
          if transport is not None:
              provider_retry_state = transport.provider_retry_state
          record = {
              'schema_version': 'qsl.soxl-soxx-core-only-daily-p1-status.v1',
              'status': status,
              'reason_code': reason_code,
              'provider_retry_state': provider_retry_state,
              'date_cutoff': cutoff,
              'candidate': {
                  'candidate_id': P2_V3_CONTRACT.candidate_id,
                  'config_sha256': P2_V3_CONTRACT.config_sha256,
              },
              'input_manifest_sha256': manifest_sha256,
          }
          encoded = json.dumps(record, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          status_path.write_bytes(encoded)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'date_cutoff={cutoff}\n')
              output.write(f'status={status}\n')
              output.write(f'reason_code={reason_code}\n')
              output.write(f'provider_retry_state={provider_retry_state}\n')
              output.write(f'manifest_sha256={manifest_sha256}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'SOXL_P1_STATUS={status}\n')
              summary.write(f'SOXL_DATE_CUTOFF={cutoff}\n')
              summary.write(f'SOXL_P1_PROVIDER_RETRY_STATE={provider_retry_state}\n')
              summary.write(f'SOXL_P1_STATUS_SHA256={hashlib.sha256(encoded).hexdigest()}\n')
              if reason_code:
                  summary.write(f'SOXL_P1_REASON_CODE={reason_code}\n')
              if manifest_sha256:
                  summary.write(f'SOXL_P1_MANIFEST_SHA256={manifest_sha256}\n')
          PY
      - name: Authenticate to Google Cloud for accepted P1 only
        if: steps.acquire.outputs.status == 'ACCEPTED'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up gcloud for accepted P1 only
        if: steps.acquire.outputs.status == 'ACCEPTED'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Create-only upload of completed accepted P1 root
        if: steps.acquire.outputs.status == 'ACCEPTED'
        env:
          MANIFEST_SHA256: ${{ steps.acquire.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/soxl-daily-research/p1-root"
          destination="gs://qsl-runtime-logs-shared/soxl-p1-p3/${MANIFEST_SHA256}"
          if gcloud storage ls "${destination}/p1-complete.json" >/dev/null 2>&1; then
            exit 1
          fi
          gcloud storage cp --quiet --no-clobber "$root/binding.json" "$root/bars.json" "$root/manifest.json" "${destination}/" >/dev/null
          gcloud storage cp --quiet --no-clobber "$root/p1-complete.json" "${destination}/p1-complete.json" >/dev/null
          printf 'SOXL_P1_REMOTE_COMPLETION=CREATE_ONLY_COMPLETE\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Build optional verified decision-data projection
        if: steps.acquire.outputs.status == 'ACCEPTED'
        id: decision_projection
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/soxl-daily-research/p1-root"
          projection_root="${RUNNER_TEMP}/soxl-daily-research/decision-price-series"
          ROOT="$root" PROJECTION_ROOT="$projection_root" uv run --no-sync python - <<'PY'
          import os
          import subprocess

          from us_equity_snapshot_pipelines.lifecycle.decision_data_projection import (
              extract_soxl_bars_daily_series,
              publish_verified_daily_price_series_projection,
          )
          from us_equity_snapshot_pipelines.lifecycle.soxl_core_only_p1_publisher import (
              verify_soxl_core_only_input_root,
          )

          result = {"status": "PARKED"}
          try:
              published = publish_verified_daily_price_series_projection(
                  parent_root=os.environ["ROOT"],
                  output_root=os.environ["PROJECTION_ROOT"],
                  parent_verifier=verify_soxl_core_only_input_root,
                  strategy_scope="soxl_soxx_trend_income",
                  series_extractor=extract_soxl_bars_daily_series,
                  producer={
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "commit_sha": os.environ["GITHUB_SHA"],
                      "tree_sha": subprocess.check_output(
                          ["git", "rev-parse", "HEAD^{tree}"], text=True
                      ).strip(),
                      "tool": "verified_daily_decision_data_projection",
                      "tool_version": "v1",
                  },
              )
              result = {"status": "PUBLISHED", "manifest_sha256": published["manifest_sha256"]}
          # The projection is an observer-stage artifact.  It must not alter
          # the accepted P1/P3 research path when unavailable.
          except Exception:
              pass
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"status={result['status']}\n")
              if result.get("manifest_sha256"):
                  output.write(f"manifest_sha256={result['manifest_sha256']}\n")
          print(result["status"])
          PY
      - name: Create-only upload verified decision-data projection
        if: steps.decision_projection.outputs.status == 'PUBLISHED'
        id: decision_projection_upload
        env:
          PROJECTION_MANIFEST_SHA256: ${{ steps.decision_projection.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/soxl-daily-research/decision-price-series"
          destination="gs://qsl-runtime-logs-shared/decision-data-projections/v1/us_equity/soxl_soxx_trend_income/${PROJECTION_MANIFEST_SHA256}"
          if gcloud storage ls "${destination}/" >/dev/null 2>&1; then
            printf 'DECISION_DATA_PROJECTION_STATUS=PARKED\n' >> "$GITHUB_STEP_SUMMARY"
            printf 'status=PARKED\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Upload the data member before the manifest.  Consumers treat the
          # immutable manifest as the visibility/commit record.
          if gcloud storage cp --quiet --no-clobber "$root/decision-price-series.json" "${destination}/decision-price-series.json" >/dev/null \
            && gcloud storage cp --quiet --no-clobber "$root/manifest.json" "${destination}/manifest.json" >/dev/null; then
            printf 'DECISION_DATA_PROJECTION_STATUS=CREATE_ONLY_COMPLETE\n' >> "$GITHUB_STEP_SUMMARY"
            printf 'status=CREATE_ONLY_COMPLETE\n' >> "$GITHUB_OUTPUT"
          else
            printf 'DECISION_DATA_PROJECTION_STATUS=PARKED\n' >> "$GITHUB_STEP_SUMMARY"
            printf 'status=PARKED\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Record parked optional decision-data projection
        if: steps.acquire.outputs.status == 'ACCEPTED' && steps.decision_projection.outputs.status != 'PUBLISHED'
        run: echo 'DECISION_DATA_PROJECTION_STATUS=PARKED' >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve sanitized decision-data projection terminal state
        if: always()
        id: decision_projection_terminal
        env:
          P1_STATUS: ${{ steps.acquire.outputs.status }}
          BUILD_STATUS: ${{ steps.decision_projection.outputs.status }}
          UPLOAD_STATUS: ${{ steps.decision_projection_upload.outputs.status }}
        run: |
          set -euo pipefail
          status=NOT_ATTEMPTED
          if [ "$P1_STATUS" = 'ACCEPTED' ]; then
            if [ "$BUILD_STATUS" = 'PUBLISHED' ] && [ "$UPLOAD_STATUS" = 'CREATE_ONLY_COMPLETE' ]; then
              status=PUBLISHED
            else
              status=PARKED
            fi
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'DECISION_DATA_PROJECTION_TERMINAL_STATUS=%s\n' "$status" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized P1 terminal status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soxl-p1-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soxl-daily-research/p1-status.json
          if-no-files-found: error
          retention-days: 35

  p3:
    needs: p1
    if: needs.p1.outputs.status == 'ACCEPTED'
    runs-on: ubuntu-latest
    environment: market-data-nonlive
    outputs:
      status: ${{ steps.terminal.outputs.status }}
      evidence_summary_sha256: ${{ steps.terminal.outputs.evidence_summary_sha256 }}
      failure_class: ${{ steps.terminal.outputs.failure_class }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Download and verify the completed immutable P1 root
        env:
          MANIFEST_SHA256: ${{ needs.p1.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/soxl-daily-research/p3-input"
          completion="${RUNNER_TEMP}/soxl-daily-research/p1-complete.json"
          source="gs://qsl-runtime-logs-shared/soxl-p1-p3/${MANIFEST_SHA256}"
          mkdir -p "$root"
          chmod 700 "$root"
          gcloud storage cp --quiet "$source/binding.json" "$source/bars.json" "$source/manifest.json" "$root/" >/dev/null
          gcloud storage cp --quiet "$source/p1-complete.json" "$completion" >/dev/null
          ROOT="$root" COMPLETION="$completion" EXPECTED_MANIFEST_SHA256="$MANIFEST_SHA256" uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          from us_equity_snapshot_pipelines.lifecycle.soxl_core_only_p1_publisher import (
              verify_soxl_core_only_input_root,
              verify_soxl_core_only_p1_remote_completion,
          )
          root = Path(os.environ['ROOT'])
          if verify_soxl_core_only_input_root(root) != os.environ['EXPECTED_MANIFEST_SHA256']:
              raise SystemExit('unexpected SOXL P1 manifest')
          verify_soxl_core_only_p1_remote_completion(root, os.environ['COMPLETION'])
          PY
      - name: Run offline P3 once and record a sanitized terminal state
        id: terminal
        env:
          MANIFEST_SHA256: ${{ needs.p1.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/soxl-daily-research/p3-input"
          ues="${RUNNER_TEMP}/soxl-daily-research/ues"
          summary="${RUNNER_TEMP}/soxl-daily-research/p3-summary.json"
          git clone --quiet --no-checkout https://github.com/QuantStrategyLab/UsEquityStrategies.git "$ues"
          git -C "$ues" fetch --quiet --depth=1 origin 7756fe32585e85cf1d09a163203a02e3eee39fe1
          git -C "$ues" checkout --quiet --detach 7756fe32585e85cf1d09a163203a02e3eee39fe1
          uv run --no-sync python scripts/run_soxl_core_only_p3_evidence.py \
            --p1-binding "$root/binding.json" \
            --input-manifest "$root/manifest.json" \
            --bars-member "$root/bars.json" \
            --ues-project "$ues" \
            --p2-candidate config/soxl_soxx_core_only_p2_v3.json > "$summary"
          SUMMARY="$summary" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ['SUMMARY']).read_bytes())
          if result.get('status') == 'SUCCESS' and isinstance(result.get('evidence_summary_sha256'), str):
              status = 'SUCCESS'
              evidence = result['evidence_summary_sha256']
              failure_class = ''
          elif set(result) == {'schema_version', 'status', 'failure_class'} and result['status'] == 'PARKED':
              status = 'PARKED'
              evidence = ''
              failure_class = result['failure_class']
          else:
              raise SystemExit('invalid sanitized SOXL P3 terminal result')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'status={status}\n')
              output.write(f'evidence_summary_sha256={evidence}\n')
              output.write(f'failure_class={failure_class}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(f'SOXL_P3_STATUS={status}\n')
              if evidence:
                  output.write(f'SOXL_P3_EVIDENCE_SUMMARY_SHA256={evidence}\n')
              else:
                  output.write(f'SOXL_P3_FAILURE_CLASS={result["failure_class"]}\n')
          PY
      - name: Build sanitized P3 research performance observation
        if: steps.terminal.outputs.status == 'SUCCESS'
        env:
          P3_EVIDENCE_SHA256: ${{ steps.terminal.outputs.evidence_summary_sha256 }}
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/build_soxl_p3_strategy_performance.py \
            --evidence-summary "${RUNNER_TEMP}/soxl-daily-research/p3-summary.json" \
            --expected-evidence-sha256 "$P3_EVIDENCE_SHA256" \
            --producer-revision "$GITHUB_SHA" \
            --computed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "${RUNNER_TEMP}/soxl-daily-research/strategy_performance.v2.json"
      - name: Upload sanitized P3 terminal state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soxl-p3-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soxl-daily-research/p3-summary.json
          if-no-files-found: error
          retention-days: 35
      - name: Upload sanitized P3 research performance observation
        if: steps.terminal.outputs.status == 'SUCCESS'
        uses: actions/upload-artifact@v7
        with:
          name: soxl-p3-research-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soxl-daily-research/strategy_performance.v2.json
          if-no-files-found: error
          retention-days: 35

  publish-control-plane:
    needs: [p1, p3]
    if: always()
    runs-on: ubuntu-latest
    environment: market-data-nonlive
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked snapshot builder
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Build one sanitized control-plane source snapshot
        env:
          P1_JOB_RESULT: ${{ needs.p1.result }}
          P1_STATUS: ${{ needs.p1.outputs.status }}
          P1_REASON_CODE: ${{ needs.p1.outputs.reason_code }}
          P1_MANIFEST_SHA256: ${{ needs.p1.outputs.manifest_sha256 }}
          DECISION_PROJECTION_STATUS: ${{ needs.p1.outputs.decision_projection_status }}
          P3_JOB_RESULT: ${{ needs.p3.result }}
          P3_STATUS: ${{ needs.p3.outputs.status }}
          P3_EVIDENCE_SHA256: ${{ needs.p3.outputs.evidence_summary_sha256 }}
          P3_FAILURE_CLASS: ${{ needs.p3.outputs.failure_class }}
        run: |
          set -euo pipefail
          output_path="${RUNNER_TEMP}/soxl-daily-research/control-plane-source.json"
          mkdir -p "$(dirname "$output_path")"
          config_sha256="$(uv run --no-sync python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from us_equity_snapshot_pipelines.lifecycle.soxl_core_only_p2_v3_contract import P2_V3_CONTRACT

          candidate = json.loads(Path('config/soxl_soxx_core_only_p2_v3.json').read_text(encoding='utf-8'))
          canonical = json.dumps(
              candidate, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False
          ).encode('utf-8')
          digest = hashlib.sha256(canonical).hexdigest()
          if digest != P2_V3_CONTRACT.config_sha256:
              raise SystemExit('unexpected SOXL P2 v3 candidate policy')
          print(digest)
          PY
          )"
          p1_status="$P1_STATUS"
          p1_reason_code="$P1_REASON_CODE"
          p1_manifest_sha256="$P1_MANIFEST_SHA256"
          decision_projection_status="$DECISION_PROJECTION_STATUS"
          if [ "$P1_JOB_RESULT" != 'success' ]; then
            p1_status=''
            p1_reason_code=''
            p1_manifest_sha256=''
            decision_projection_status=NOT_ATTEMPTED
          fi
          p3_status="$P3_STATUS"
          p3_evidence_sha256="$P3_EVIDENCE_SHA256"
          p3_failure_class="$P3_FAILURE_CLASS"
          if [ "$P3_JOB_RESULT" != 'success' ]; then
            p3_status=''
            p3_evidence_sha256=''
            p3_failure_class=''
          fi
          uv run --no-sync python scripts/build_soxl_daily_control_plane_source_snapshot.py \
            --output "$output_path" \
            --computed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --source-revision "$GITHUB_SHA" \
            --p1-status "$p1_status" \
            --p1-reason-code "$p1_reason_code" \
            --p1-manifest-sha256 "$p1_manifest_sha256" \
            --p2-config-sha256 "$config_sha256" \
            --p3-status "$p3_status" \
            --p3-evidence-sha256 "$p3_evidence_sha256" \
            --p3-failure-class "$p3_failure_class" \
            --decision-projection-status "$decision_projection_status"
          python -m json.tool "$output_path"
          printf 'CONTROL_PLANE_SOURCE_STATUS=BUILT\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish source snapshot to the read-only control plane
        env:
          CONTROL_PLANE_SYNC_URL: ${{ vars.QSL_CONTROL_PLANE_SYNC_URL }}
          CONTROL_PLANE_SYNC_TOKEN: ${{ secrets.CONTROL_PLANE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CONTROL_PLANE_SYNC_URL:-}" ] || [ -z "${CONTROL_PLANE_SYNC_TOKEN:-}" ]; then
            echo 'QSL_CONTROL_PLANE_SYNC_URL and CONTROL_PLANE_SYNC_TOKEN are required for the control-plane publisher.' >&2
            exit 2
          fi
          output_path="${RUNNER_TEMP}/soxl-daily-research/control-plane-source.json"
          response_path="${RUNNER_TEMP}/soxl-daily-research/control-plane-response.json"
          curl --fail --show-error --silent --retry 3 --retry-all-errors --connect-timeout 10 \
            --request POST \
            --header "Authorization: Bearer ${CONTROL_PLANE_SYNC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'User-Agent: QuantStrategyLab-UESP-SOXL-ControlPlane/1' \
            --data-binary "@$output_path" \
            --output "$response_path" \
            "${CONTROL_PLANE_SYNC_URL%/}/api/internal/sync-control-plane-source"
          python - "$response_path" <<'PY'
          import json
          import sys

          response = json.loads(open(sys.argv[1], encoding='utf-8').read())
          if response != {
              'ok': True,
              'source_id': 'uesp.soxl_daily_research',
              'schema_version': 'qsl_control_plane_source_snapshot.v1',
              'candidate_count': 1,
              'generated_at': response.get('generated_at'),
          } or not isinstance(response['generated_at'], str):
              raise SystemExit('unexpected control-plane source response')
          PY
          printf 'CONTROL_PLANE_SOURCE_STATUS=PUBLISHED\n' >> "$GITHUB_STEP_SUMMARY"
