name: Batch A v2 Alpaca SIP Inputs

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Run the one-time non-live Batch A v2 Alpaca SIP acquisition"
        required: true
        default: false
        type: boolean
      batch_id:
        description: "Explicit research/v2 input batch id (required when execute=true)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: batch-a-v2-alpaca-sip-inputs
  cancel-in-progress: false

jobs:
  alpaca-migration:
    name: Alpaca acquisition moved to QuantPlatformKit
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Stop retired Alpaca acquisition
        shell: bash
        run: |
          message='ALPACA_ACQUISITION_MOVED: Public market-data acquisition belongs to QuantStrategyLab/QuantPlatformKit. This UESP acquisition path is disabled; no fetch, replay, or publication was attempted. See docs/alpaca-migration.md.'
          printf '%s\n' "$message" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '::error::%s\n' "$message"
          exit 1

  batch-a-v2-inputs:
    # Acquisition migrated; keep dependent replay/publication jobs parked too.
    # Previous condition: ${{ github.ref == 'refs/heads/main' }}
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Authenticate to Google Cloud
        if: ${{ inputs.execute }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Print plan
        if: ${{ !inputs.execute }}
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/acquire_batch_a_v2_price_snapshots_alpaca.py
      - name: Execute one-time Batch A v2 cloud acquisition
        if: ${{ inputs.execute }}
        env:
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/acquire_batch_a_v2_price_snapshots_alpaca.py \
            --execute \
            --batch-id "$BATCH_ID" \
            | tee "$RUNNER_TEMP/batch-a-v2-alpaca-sip-summary.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
