name: QQQM BOXX Historical SIP Cause

# Manual, fixed two-symbol historical access diagnosis; no order or cloud write.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qqqm-boxx-historical-sip-cause
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Diagnose fixed historical SIP window
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/diagnose_qqqm_boxx_historical_sip.py | tee "$GITHUB_STEP_SUMMARY"
