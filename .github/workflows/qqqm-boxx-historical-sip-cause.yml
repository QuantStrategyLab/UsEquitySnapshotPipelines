name: QQQM BOXX Historical SIP Cause

# Manual, fixed two-symbol historical access diagnosis; no order or cloud write.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qqqm-boxx-historical-sip-cause
  cancel-in-progress: false

jobs:
  alpaca-migration:
    name: Alpaca acquisition moved to QuantPlatformKit
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Stop retired Alpaca acquisition
        shell: bash
        run: |
          message='ALPACA_ACQUISITION_MOVED: Public market-data acquisition belongs to QuantStrategyLab/QuantPlatformKit. This UESP acquisition path is disabled; no fetch, replay, or publication was attempted. See docs/alpaca-migration.md.'
          printf '%s\n' "$message" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '::error::%s\n' "$message"
          exit 1

  diagnose:
    # Acquisition migrated; keep dependent replay/publication jobs parked too.
    # Previous condition: github.ref == 'refs/heads/main'
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Diagnose fixed historical SIP window
        run: |
          set -euo pipefail
          python scripts/diagnose_qqqm_boxx_historical_sip.py | tee "$GITHUB_STEP_SUMMARY"
