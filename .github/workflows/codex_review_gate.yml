name: Codex Final Review

# Read-only V2 evaluator.  It never requests a review, writes to a PR/issue,
# polls, or performs a merge.  A trigger only evaluates existing evidence.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: codex-final-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  codex-final-review:
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
      || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
      || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout evaluator
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Evaluate immutable V2 review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/gate_codex_app_review.py
