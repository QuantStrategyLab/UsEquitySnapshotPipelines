name: Global ETF Learning Inputs

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Run the one-time non-live cloud acquisition"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: global-etf-learning-inputs
  cancel-in-progress: false

jobs:
  learning-inputs:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Authenticate to Google Cloud
        if: ${{ inputs.execute }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Print plan
        if: ${{ !inputs.execute }}
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/acquire_global_etf_learning_inputs_alpaca.py
      - name: Execute one-time cloud acquisition
        if: ${{ inputs.execute }}
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/acquire_global_etf_learning_inputs_alpaca.py --execute-cloud \
            | tee "$RUNNER_TEMP/global-etf-learning-summary.json" \
            >> "$GITHUB_STEP_SUMMARY"
