name: Russell Core Research Case

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: russell-core-research-case
  cancel-in-progress: false

jobs:
  research-case:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Run one-shot non-live research case
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/run_russell_core_case.py --run | tee "$RUNNER_TEMP/russell-core-summary.json"
          cat "$RUNNER_TEMP/russell-core-summary.json" >> "$GITHUB_STEP_SUMMARY"
