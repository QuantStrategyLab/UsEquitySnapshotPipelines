name: TQQQ V9 Benchmark-Guard P1-P3 Manual Research

on:
  workflow_dispatch:
    inputs:
      mandate_id:
        description: Checked-in V9 non-live scope record ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: tqqq-p2-v9-benchmark-guard-manual-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Verify V9 scope record before provider access
        id: mandate
        env:
          MANDATE_ID: ${{ inputs.mandate_id }}
        run: |
          set -euo pipefail
          result="$(uv run --no-sync python scripts/verify_tqqq_p1_p3_mandate.py --mandates-root config/tqqq_p1_p3_mandates --mandate-id "$MANDATE_ID")"
          RESULT="$result" uv run --no-sync python - <<'PY'
          import json, os
          value = json.loads(os.environ['RESULT'])
          expected = 'tqqq-v9-benchmark-guard-20260826'
          if value.get('status') != 'NONLIVE_SCOPE_RECORD_VERIFIED' or value.get('mandate_id') != expected:
              raise SystemExit('V9 scope verification failed')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"mandate_id={value['mandate_id']}\nmandate_receipt_sha256={value['mandate_receipt_sha256']}\n")
          PY
      - name: Resolve immutable settled V9 date cutoff
        id: binding
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import os
          from datetime import UTC, datetime, timedelta
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import P2_V9_CONTRACT, _expected_xnys_sessions, build_tqqq_core_only_p1_binding_for_contract
          # The free dual-source contract is intentionally used only after
          # the calibration's T+2 settlement point.  This avoids treating a
          # normal same-session vendor revision as a P1 source failure while
          # retaining the existing exact two-source assurance gate.
          completed_sessions = _expected_xnys_sessions((datetime.now(UTC).date() - timedelta(days=1)).isoformat())
          cutoff = completed_sessions[-3].isoformat()
          build_tqqq_core_only_p1_binding_for_contract(P2_V9_CONTRACT, date_cutoff=cutoff)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'date_cutoff={cutoff}\n')
          PY
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Acquire one assured V9 P1 root or park
        id: p1
        env:
          DATE_CUTOFF: ${{ steps.binding.outputs.date_cutoff }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v9-benchmark-guard/p1-root"
          status="${RUNNER_TEMP}/tqqq-v9-benchmark-guard/p1-status.json"
          mkdir -p "$(dirname "$root")"
          ROOT="$root" STATUS="$status" uv run --no-sync python - <<'PY'
          import json, os, subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from scripts.acquire_tqqq_core_only_free_ohlcv_p1 import TwelveYahooOhlcvObserver
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_free_ohlcv_p1 import TqqqCoreOnlyFreeOhlcvP1Error, TqqqCoreOnlyFreeOhlcvP1UnavailableError, classify_tqqq_core_only_free_ohlcv_availability, publish_tqqq_core_only_free_ohlcv_p1_inputs
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import P2_V9_CONTRACT
          observed = datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          status, manifest, reason, availability = 'PARKED', '', 'FREE_SOURCE_UNAVAILABLE', {}
          try:
              result = publish_tqqq_core_only_free_ohlcv_p1_inputs(
                  TwelveYahooOhlcvObserver(os.environ.get('TWELVE_DATA_API_KEY', '')),
                  output_root=os.environ['ROOT'],
                  observed_at=observed,
                  date_cutoff=os.environ['DATE_CUTOFF'],
                  producer={
                      'repository': 'QuantStrategyLab/UsEquitySnapshotPipelines',
                      'commit_sha': os.environ['GITHUB_SHA'],
                      'tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                      'tool': 'tqqq_core_only_free_ohlcv_p1',
                      'tool_version': 'v1',
                  },
                  contract=P2_V9_CONTRACT,
              )
              status, manifest, reason = 'ACCEPTED', result['manifest_sha256'], ''
          except TqqqCoreOnlyFreeOhlcvP1UnavailableError as exc:
              observed_availability = getattr(exc, 'availability_diagnostic', None)
              if isinstance(observed_availability, dict):
                  availability = observed_availability
                  reason = classify_tqqq_core_only_free_ohlcv_availability(availability)
          except TqqqCoreOnlyFreeOhlcvP1Error:
              reason = 'FREE_SOURCE_CONTRACT_FAILURE'
          record = {
              'schema_version': 'qsl.tqqq-p2-v9-benchmark-guard-p1-manual-status.v1',
              'candidate': {'candidate_id': P2_V9_CONTRACT.candidate_id, 'config_sha256': P2_V9_CONTRACT.config_sha256},
              'date_cutoff': os.environ['DATE_CUTOFF'],
              'status': status,
              'reason_code': reason,
              'input_manifest_sha256': manifest,
              'availability_diagnostic': availability,
          }
          Path(os.environ['STATUS']).write_bytes(json.dumps(record, sort_keys=True, separators=(',', ':')).encode())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'status={status}\nmanifest_sha256={manifest}\n')
          PY
      - name: Create-only upload accepted private P1 root
        if: steps.p1.outputs.status == 'ACCEPTED'
        env:
          MANIFEST_SHA256: ${{ steps.p1.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v9-benchmark-guard/p1-root"
          dest="gs://qsl-runtime-logs-shared/tqqq-p1-p3/${MANIFEST_SHA256}"
          gcloud storage ls "$dest/" >/dev/null 2>&1 && exit 1
          gcloud storage cp --quiet --no-clobber "$root/binding.json" "$root/bars.json" "$root/assurance.json" "$root/manifest.json" "$dest/" >/dev/null
      - name: Run offline V9 P3 and write only sanitized evidence metadata
        if: steps.p1.outputs.status == 'ACCEPTED'
        env:
          MANIFEST_SHA256: ${{ steps.p1.outputs.manifest_sha256 }}
          MANDATE_ID: ${{ steps.mandate.outputs.mandate_id }}
          MANDATE_RECEIPT_SHA256: ${{ steps.mandate.outputs.mandate_receipt_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v9-benchmark-guard/p1-root"
          result_path="${RUNNER_TEMP}/tqqq-v9-benchmark-guard/p3-result.json"
          status_path="${RUNNER_TEMP}/tqqq-v9-benchmark-guard/p3-status.json"
          output_root="${RUNNER_TEMP}/tqqq-v9-benchmark-guard/p3-output"
          exit_code=0
          uv run --no-sync python scripts/run_tqqq_p3.py \
            --snapshot-root "$root" \
            --config config/tqqq_core_only_p2_v9_benchmark_drawdown_guard.json \
            --mandate-receipt-sha256 "$MANDATE_RECEIPT_SHA256" \
            --output-dir "$output_root" > "$result_path" || exit_code=$?
          RESULT_PATH="$result_path" STATUS_PATH="$status_path" SNAPSHOT_ROOT="$root" OUTPUT_ROOT="$output_root" EXIT_CODE="$exit_code" uv run --no-sync python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from us_equity_snapshot_pipelines.lifecycle.relative_benchmark_terminal_summary import build_relative_benchmark_terminal_summary, canonical_relative_benchmark_terminal_summary_bytes
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import P2_V9_CONTRACT
          from us_equity_snapshot_pipelines.lifecycle.tqqq_p3_v7_evidence_index import validate_tqqq_p3_v7_result
          from us_equity_snapshot_pipelines.lifecycle.tqqq_p3_v9_evidence_index import build_tqqq_p3_v9_evidence_index, canonical_tqqq_p3_v9_evidence_index_bytes
          result_path = Path(os.environ['RESULT_PATH'])
          completed = os.environ['EXIT_CODE'] == '0'
          try:
              result = json.loads(result_path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError):
              result, completed = None, False
          if completed:
              terminal = validate_tqqq_p3_v7_result(result)
          elif isinstance(result, dict):
              expected = {'complete_evidence', 'failure_class', 'replay_started', 'source_commit', 'stage', 'status'}
              if set(result) != expected or result.get('status') != 'PARKED' or result.get('complete_evidence') is not False:
                  raise SystemExit('invalid sanitized P3 failure')
              terminal = result
          else:
              terminal = {'complete_evidence': False, 'failure_class': 'runtime_internal_failure', 'replay_started': True, 'source_commit': os.environ['GITHUB_SHA'], 'stage': 'runtime_internal', 'status': 'PARKED'}
          record = {
              'schema_version': 'qsl.tqqq-p2-v9-benchmark-guard-p3-manual-status.v1',
              'candidate': {'candidate_id': P2_V9_CONTRACT.candidate_id, 'config_sha256': P2_V9_CONTRACT.config_sha256},
              'input_manifest_sha256': os.environ['MANIFEST_SHA256'],
              'p3_terminal': terminal,
              'authority_scope': 'RESEARCH_ONLY',
              'automatic_promotion': False,
              'no_order': True,
          }
          if completed:
              manifest = json.loads((Path(os.environ['SNAPSHOT_ROOT']) / 'manifest.json').read_text(encoding='utf-8'))
              index = build_tqqq_p3_v9_evidence_index(
                  p1_manifest_sha256=os.environ['MANIFEST_SHA256'],
                  nonlive_scope_record={'mandate_id': os.environ['MANDATE_ID'], 'receipt_sha256': os.environ['MANDATE_RECEIPT_SHA256']},
                  p3_result=terminal,
                  input_producer=manifest['producer'],
                  producer={
                      'repository': os.environ['GITHUB_REPOSITORY'],
                      'commit_sha': os.environ['GITHUB_SHA'],
                      'tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                      'tool': 'tqqq_p1_p3_v9_benchmark_guard_evidence_index',
                      'tool_version': 'v1',
                      'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                      'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  },
              )
              index_path = Path(os.environ['STATUS_PATH']).with_name('p3-evidence-index.json')
              index_path.write_bytes(canonical_tqqq_p3_v9_evidence_index_bytes(index))
              index_path.chmod(0o600)
              record['p3_evidence_index_sha256'] = hashlib.sha256(index_path.read_bytes()).hexdigest()
              policy = json.loads((Path(os.environ['OUTPUT_ROOT']) / 'relative-benchmark-policy.v1.json').read_text(encoding='utf-8'))
              summary = build_relative_benchmark_terminal_summary(
                  candidate={'candidate_id': P2_V9_CONTRACT.candidate_id, 'config_sha256': P2_V9_CONTRACT.config_sha256},
                  input_manifest_sha256=os.environ['MANIFEST_SHA256'],
                  p3_result=terminal,
                  relative_benchmark_policy=policy,
              )
              summary_path = Path(os.environ['STATUS_PATH']).with_name('relative-benchmark-summary.json')
              summary_path.write_bytes(canonical_relative_benchmark_terminal_summary_bytes(summary))
              summary_path.chmod(0o600)
              record['relative_benchmark_summary_sha256'] = hashlib.sha256(summary_path.read_bytes()).hexdigest()
          status_path = Path(os.environ['STATUS_PATH'])
          status_path.write_bytes(json.dumps(record, sort_keys=True, separators=(',', ':')).encode())
          status_path.chmod(0o600)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"P3_STATUS={terminal['status']}\nP4_P5_P6=NOT_AUTHORIZED\n")
          PY
      - name: Create-only upload of sanitized V9 P3 metadata
        if: always() && steps.p1.outputs.status == 'ACCEPTED'
        env:
          MANIFEST_SHA256: ${{ steps.p1.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          status_path="${RUNNER_TEMP}/tqqq-v9-benchmark-guard/p3-status.json"
          destination="gs://qsl-runtime-logs-shared/tqqq-p1-p3/${MANIFEST_SHA256}"
          gcloud storage cp --quiet --no-clobber "$status_path" "${destination}/tqqq-v9-p3-status.json" >/dev/null
          index_path="${RUNNER_TEMP}/tqqq-v9-benchmark-guard/p3-evidence-index.json"
          if [ -f "$index_path" ]; then
            gcloud storage cp --quiet --no-clobber "$index_path" "${destination}/tqqq-v9-p3-evidence-index.json" >/dev/null
          fi
          summary_path="${RUNNER_TEMP}/tqqq-v9-benchmark-guard/relative-benchmark-summary.json"
          if [ -f "$summary_path" ]; then
            gcloud storage cp --quiet --no-clobber "$summary_path" "${destination}/tqqq-v9-relative-benchmark-summary.json" >/dev/null
          fi
      - name: Upload sanitized terminal status only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tqqq-v9-benchmark-guard-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tqqq-v9-benchmark-guard/p1-status.json
            ${{ runner.temp }}/tqqq-v9-benchmark-guard/p3-result.json
            ${{ runner.temp }}/tqqq-v9-benchmark-guard/p3-status.json
            ${{ runner.temp }}/tqqq-v9-benchmark-guard/p3-evidence-index.json
            ${{ runner.temp }}/tqqq-v9-benchmark-guard/relative-benchmark-summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Record lifecycle boundary
        if: always()
        run: echo 'P4_P5_P6=NOT_AUTHORIZED; AUTHORITY=RESEARCH_ONLY_NO_ORDER' >> "$GITHUB_STEP_SUMMARY"
