name: Small Account Cost Comparison (research)

# Pre-registered 2026-11-26 (docs/research/small-account-cost-comparison.md).
# Research only: public adjusted prices, no credentials, no orders, nothing published.
on:
  workflow_dispatch:
    inputs:
      end_date:
        description: Last price date (YYYY-MM-DD), within the merged research mandate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: small-account-cost-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Run the pre-registered comparison
        env:
          END_DATE: ${{ inputs.end_date }}
        run: |
          set -euo pipefail
          [[ "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "invalid end_date"; exit 2; }
          args=(--output-dir out --end-date "$END_DATE")
          uv run --no-sync python -m us_equity_snapshot_pipelines.research.small_account_cost_comparison "${args[@]}"
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: small-account-cost-comparison
          path: out/
          retention-days: 30
