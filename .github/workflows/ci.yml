name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[test]' 'ruff==0.15.9'
      - name: Run Ruff
        run: python -m ruff check .
      - name: Verify isolated locked TQQQ runtime
        env:
          TARGET_PYTHON: '3.11'
        run: |
          python -m pip install 'uv==0.11.19'
          target="$RUNNER_TEMP/tqqq-offline-runtime-smoke"
          env -u UV_PYTHON -u VIRTUAL_ENV uv venv --python "$TARGET_PYTHON" "$target/.venv"
          SOURCE_ROOT="$GITHUB_WORKSPACE" "$target/.venv/bin/python" -I -c '
          import importlib.util
          import os
          import sys
          from pathlib import Path

          source_root = Path(os.environ["SOURCE_ROOT"])
          module_path = source_root / "src/us_equity_snapshot_pipelines/tqqq_offline_replay_runtime.py"
          spec = importlib.util.spec_from_file_location("tqqq_runtime_smoke", module_path)
          assert spec is not None and spec.loader is not None
          runtime = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = runtime
          spec.loader.exec_module(runtime)
          manifest = runtime.derive_tqqq_offline_replay_runtime_manifest(
              source_root, python_major_minor="3.11"
          ).to_dict()
          assert set(manifest) == {
              "schema_version", "uesp_revision", "lockfile_sha256", "python_major_minor"
          }
          assert manifest["python_major_minor"] == "3.11"
          '
          env -u UV_PYTHON -u VIRTUAL_ENV UV_PROJECT_ENVIRONMENT="$target/.venv" \
            uv sync --project "$GITHUB_WORKSPACE" --locked --python "$TARGET_PYTHON" \
              --no-editable --reinstall-package us-equity-snapshot-pipelines
          "$target/.venv/bin/python" -I -c '
          from importlib.metadata import distribution
          from us_equity_snapshot_pipelines.lifecycle import tqqq_promotion_runner

          assert distribution("us-equity-snapshot-pipelines").version
          assert tqqq_promotion_runner._PROFILE == "tqqq_core_only_p2_v1"
          assert tqqq_promotion_runner._COST_SCENARIOS_BPS == (5, 10, 25)
          assert (
              tqqq_promotion_runner._LOCKED_OOS_START.isoformat(),
              tqqq_promotion_runner._LOCKED_OOS_END.isoformat(),
          ) == ("2025-08-01", "2026-07-31")
          '
      - name: Run tests
        run: python -m pytest -q
