name: RS-04 Cloud Archive
run-name: RS-04 archive ${{ inputs.mode }} (one attempt)

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: inventory
        options: [inventory, regenerate]
        description: Metadata-only discovery or one create-only approved-source acquisition
      input_root:
        type: string
        default: ''
        description: Approved gs://<bucket>/research/v2/input/; falls back to RS04_INPUT_ROOT variable
      dataset_id:
        type: string
        default: rs04-alpaca-raw-20261015
        description: New dataset directory; existing objects are never overwritten
      effective_config_uri:
        type: string
        default: ''
        description: Existing effective merged JSON under input_root; only key names and types retained

permissions:
  contents: read
  id-token: write

concurrency:
  group: rs04-cloud-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: market-data-nonlive
    env:
      DISABLE_GCS_PYTHON_CLIENT_OTEL_BUCKET_METADATA: 'true'
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RS04_MODE: ${{ inputs.mode }}
      RS04_INPUT_ROOT: ${{ inputs.input_root || vars.RS04_INPUT_ROOT }}
      RS04_DATASET_ID: ${{ inputs.dataset_id }}
      RS04_EFFECTIVE_CONFIG_URI: ${{ inputs.effective_config_uri }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Synthetic archive safety checks
        run: |
          python -m pip install 'pytest>=8' 'exchange-calendars==4.13.2'
          python -m pytest -q tests/test_rs04_cloud_archive.py
      - name: Authenticate existing research OIDC identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Read object names and metadata only
        if: inputs.mode == 'inventory'
        shell: bash --noprofile --norc -eo pipefail {0}
        run: python scripts/rs04_cloud_archive.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install existing storage runtime
        if: inputs.mode == 'regenerate'
        run: python -m pip install 'google-cloud-storage==3.12.0' 'exchange-calendars==4.13.2'
      - name: Acquire and register one private archive
        if: inputs.mode == 'regenerate'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        shell: bash --noprofile --norc -eo pipefail {0}
        run: python scripts/rs04_cloud_archive.py | tee -a "$GITHUB_STEP_SUMMARY"
