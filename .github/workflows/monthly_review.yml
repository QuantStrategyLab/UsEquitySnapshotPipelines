name: Monthly Snapshot Review

"on":
  workflow_run:
    workflows: ["Publish Snapshot Artifacts"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Optional publish run for ancillary evidence; snapshots use latest per strategy"
        required: false
        default: ""
      report_month:
        description: "Optional report month in YYYY-MM format"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  monthly-review:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: monthly-snapshot-review-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write

    env:
      REVIEW_LABEL: monthly-review
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install monthly review dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Collect latest snapshot artifacts per strategy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          python scripts/collect_monthly_review_artifacts.py \
            --repo "${GITHUB_REPOSITORY}" \
            --source-run-id "$SOURCE_RUN_ID" \
            --output-dir data/output/monthly_review_inputs \
            --report-dir data/output/monthly_report_bundle

      - name: Append source coverage
        if: always()
        run: |
          set -euo pipefail
          if [ -f data/output/monthly_report_bundle/source_coverage.md ]; then
            cat data/output/monthly_report_bundle/source_coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build live strategy health reports
        run: |
          set -euo pipefail
          artifact_root="data/output/monthly_review_inputs"
          if [ ! -d "${artifact_root}" ]; then
            artifact_root="data/output"
          fi
          python scripts/build_monthly_live_strategy_health_reports.py \
            --artifact-root "${artifact_root}" \
            --output-root "${artifact_root}"

      - name: Build live decay monitors
        run: |
          set -euo pipefail
          artifact_root="data/output/monthly_review_inputs"
          if [ ! -d "${artifact_root}" ]; then
            artifact_root="data/output"
          fi
          python scripts/build_monthly_live_decay_monitors.py \
            --artifact-root "${artifact_root}" \
            --output-root "${artifact_root}"

      - name: Build Russell crash-brake research artifacts
        run: |
          set -euo pipefail
          artifact_root="data/output/monthly_review_inputs"
          if [ ! -d "${artifact_root}" ]; then
            artifact_root="data/output"
          fi
          python scripts/build_monthly_russell_crash_brake_research.py \
            --artifact-root "${artifact_root}" \
            --output-root "${artifact_root}"

      - name: Build Russell crash-brake review chain
        run: |
          set -euo pipefail
          artifact_root="data/output/monthly_review_inputs"
          if [ ! -d "${artifact_root}" ]; then
            artifact_root="data/output"
          fi
          python scripts/build_monthly_russell_crash_brake_review_chain.py \
            --artifact-root "${artifact_root}" \
            --output-root "${artifact_root}"

      - name: Build Global ETF promotion bundles
        run: |
          set -euo pipefail
          artifact_root="data/output/monthly_review_inputs"
          if [ ! -d "${artifact_root}" ]; then
            artifact_root="data/output"
          fi
          python scripts/build_monthly_global_etf_promotion_bundles.py \
            --artifact-root "${artifact_root}" \
            --output-root "${artifact_root}"

      - name: Build plugin promotion reviews
        run: |
          set -euo pipefail
          artifact_root="data/output/monthly_review_inputs"
          if [ ! -d "${artifact_root}" ]; then
            artifact_root="data/output"
          fi
          python scripts/build_monthly_plugin_promotion_reviews.py \
            --artifact-root "${artifact_root}" \
            --output-root "${artifact_root}"

      - name: Build live replacement reviews
        run: |
          set -euo pipefail
          artifact_root="data/output/monthly_review_inputs"
          if [ ! -d "${artifact_root}" ]; then
            artifact_root="data/output"
          fi
          python scripts/build_monthly_live_replacement_reviews.py \
            --artifact-root "${artifact_root}" \
            --output-root "${artifact_root}"

      - name: Build promotion readiness report
        run: |
          set -euo pipefail
          artifact_root="data/output/monthly_review_inputs"
          if [ ! -d "${artifact_root}" ]; then
            artifact_root="data/output"
          fi
          mkdir -p data/output/monthly_report_bundle/promotion_readiness
          python scripts/build_promotion_readiness_report.py \
            --artifact-root "${artifact_root}" \
            --output-dir data/output/monthly_report_bundle/promotion_readiness \
            --latest-only

      - name: Build monthly review bundle
        id: bundle
        run: |
          set -euo pipefail
          artifact_root="data/output/monthly_review_inputs"
          if [ ! -d "${artifact_root}" ]; then
            artifact_root="data/output"
          fi
          python scripts/run_monthly_report_bundle.py \
            --artifact-root "${artifact_root}" \
            --output-dir data/output/monthly_report_bundle \
            --report-month "${{ inputs.report_month || '' }}" >> "$GITHUB_OUTPUT"

      - name: Include source coverage in review
        run: |
          set -euo pipefail
          cat data/output/monthly_report_bundle/source_coverage.md >> data/output/monthly_report_bundle/ai_review_input.md
          cat data/output/monthly_report_bundle/source_coverage.md >> data/output/monthly_report_bundle/job_summary.md

      - name: Append bundle summary
        run: cat data/output/monthly_report_bundle/job_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create monthly review issue
        id: review_issue
        run: |
          set -euo pipefail
          title="Monthly Snapshot AI Review: ${{ steps.bundle.outputs.report_month }}"
          python scripts/post_monthly_ai_review_issue.py \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --label "${REVIEW_LABEL}" \
            --body-file data/output/monthly_report_bundle/ai_review_input.md >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload monthly review bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monthly-snapshot-review-${{ steps.bundle.outputs.report_month || 'unknown' }}
          path: data/output/monthly_report_bundle/
          if-no-files-found: warn
