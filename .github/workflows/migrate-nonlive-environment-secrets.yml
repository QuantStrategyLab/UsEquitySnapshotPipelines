name: Migrate Non-Live Environment Secrets

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type COPY_TQQQ_P1_P3_NONLIVE_TO_MARKET_DATA_NONLIVE to run the one-time migration."
        required: true
        type: string

# This temporary workflow is deliberately fixed-scope: no checkout and no
# caller-supplied source, target, or secret names. GH_TOKEN is a user-approved,
# short-lived migration credential and is deleted immediately after success.
permissions:
  contents: read

jobs:
  copy-secrets:
    if: inputs.confirmation == 'COPY_TQQQ_P1_P3_NONLIVE_TO_MARKET_DATA_NONLIVE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: tqqq-p1-p3-nonlive
    env:
      GH_TOKEN: ${{ secrets.MIGRATION_ENVIRONMENT_SECRET_WRITER }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      CONTROL_PLANE_SYNC_TOKEN: ${{ secrets.CONTROL_PLANE_SYNC_TOKEN }}
    steps:
      - name: Verify fixed migration inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(GH_TOKEN ALPACA_API_KEY_ID ALPACA_API_SECRET_KEY CONTROL_PLANE_SYNC_TOKEN)
          for secret_name in "${required[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Required migration input is unavailable: ${secret_name}" >&2
              exit 1
            fi
          done
          echo "All fixed migration inputs are available."

      - name: Copy fixed secrets to market-data-nonlive
        shell: bash
        run: |
          set -euo pipefail
          required=(ALPACA_API_KEY_ID ALPACA_API_SECRET_KEY CONTROL_PLANE_SYNC_TOKEN)
          for secret_name in "${required[@]}"; do
            # gh reads stdin so values never appear in command arguments or logs.
            printf '%s' "${!secret_name}" | gh secret set "${secret_name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --env market-data-nonlive
            echo "Migrated ${secret_name}."
          done

      - name: Verify destination secret names only
        shell: bash
        run: |
          set -euo pipefail
          destination_names="$(gh secret list --repo "${GITHUB_REPOSITORY}" --env market-data-nonlive --json name --jq '.[].name')"
          required=(ALPACA_API_KEY_ID ALPACA_API_SECRET_KEY CONTROL_PLANE_SYNC_TOKEN TWELVE_DATA_API_KEY)
          for secret_name in "${required[@]}"; do
            if ! grep -Fqx "${secret_name}" <<<"${destination_names}"; then
              echo "Destination secret is missing: ${secret_name}" >&2
              exit 1
            fi
          done
          echo "Destination secret contract is complete."
