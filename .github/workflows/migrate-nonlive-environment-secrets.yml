name: Migrate Non-Live Environment Secrets

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type COPY_TQQQ_P1_P3_NONLIVE_TO_MARKET_DATA_NONLIVE to run the one-time migration."
        required: true
        type: string

# This is a short-lived, fixed-scope migration workflow. It has no checkout,
# accepts no source/target/name inputs, and never prints secret values.
permissions:
  actions: write
  contents: read

jobs:
  copy-secrets:
    if: inputs.confirmation == 'COPY_TQQQ_P1_P3_NONLIVE_TO_MARKET_DATA_NONLIVE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: tqqq-p1-p3-nonlive
    env:
      GH_TOKEN: ${{ github.token }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      CONTROL_PLANE_SYNC_TOKEN: ${{ secrets.CONTROL_PLANE_SYNC_TOKEN }}
    steps:
      - name: Verify the fixed source secret set
        shell: bash
        run: |
          set -euo pipefail
          required=(ALPACA_API_KEY_ID ALPACA_API_SECRET_KEY CONTROL_PLANE_SYNC_TOKEN)
          for secret_name in "${required[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Required source secret is unavailable: ${secret_name}" >&2
              exit 1
            fi
          done
          echo "All required source secrets are available."

      - name: Copy the fixed secret set to market-data-nonlive
        shell: bash
        run: |
          set -euo pipefail
          required=(ALPACA_API_KEY_ID ALPACA_API_SECRET_KEY CONTROL_PLANE_SYNC_TOKEN)
          for secret_name in "${required[@]}"; do
            # gh reads the value from stdin, keeping it out of command arguments and logs.
            printf '%s' "${!secret_name}" | gh secret set "${secret_name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --env market-data-nonlive
            echo "Migrated ${secret_name}."
          done

      - name: Verify destination secret names only
        shell: bash
        run: |
          set -euo pipefail
          destination_names="$(gh secret list --repo "${GITHUB_REPOSITORY}" --env market-data-nonlive --json name --jq '.[].name')"
          required=(ALPACA_API_KEY_ID ALPACA_API_SECRET_KEY CONTROL_PLANE_SYNC_TOKEN TWELVE_DATA_API_KEY)
          for secret_name in "${required[@]}"; do
            if ! grep -Fqx "${secret_name}" <<<"${destination_names}"; then
              echo "Destination secret is missing: ${secret_name}" >&2
              exit 1
            fi
          done
          echo "Destination secret contract is complete."
