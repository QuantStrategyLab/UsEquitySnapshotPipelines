name: TQQQ V8 Free-OHLCV P1-P3 Manual Research

on:
  workflow_dispatch:
    inputs:
      mandate_id:
        description: Checked-in V8 non-live scope record ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: tqqq-p2-v8-free-ohlcv-manual-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Verify V8 scope record before provider access
        id: mandate
        env:
          MANDATE_ID: ${{ inputs.mandate_id }}
        run: |
          set -euo pipefail
          result="$(uv run --no-sync python scripts/verify_tqqq_p1_p3_mandate.py --mandates-root config/tqqq_p1_p3_mandates --mandate-id "$MANDATE_ID")"
          RESULT="$result" uv run --no-sync python - <<'PY'
          import json, os
          value = json.loads(os.environ['RESULT'])
          if value.get('status') != 'NONLIVE_SCOPE_RECORD_VERIFIED': raise SystemExit('scope verification failed')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"mandate_id={value['mandate_id']}\nmandate_receipt_sha256={value['mandate_receipt_sha256']}\n")
          PY
      - name: Resolve immutable V8 date cutoff
        id: binding
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import os
          from datetime import UTC, datetime, timedelta
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import P2_V8_CONTRACT, _expected_xnys_sessions, build_tqqq_core_only_p1_binding_for_contract
          cutoff = _expected_xnys_sessions((datetime.now(UTC).date() - timedelta(days=1)).isoformat())[-1].isoformat()
          build_tqqq_core_only_p1_binding_for_contract(P2_V8_CONTRACT, date_cutoff=cutoff)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write(f'date_cutoff={cutoff}\n')
          PY
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Acquire one assured V8 P1 root or park
        id: p1
        env:
          DATE_CUTOFF: ${{ steps.binding.outputs.date_cutoff }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v8-free-ohlcv/p1-root"; status="${RUNNER_TEMP}/tqqq-v8-free-ohlcv/p1-status.json"; mkdir -p "$(dirname "$root")"
          ROOT="$root" STATUS="$status" uv run --no-sync python - <<'PY'
          import hashlib, json, os, subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from scripts.acquire_tqqq_core_only_free_ohlcv_p1 import TwelveYahooOhlcvObserver
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_free_ohlcv_p1 import TqqqCoreOnlyFreeOhlcvP1Error, TqqqCoreOnlyFreeOhlcvP1UnavailableError, publish_tqqq_core_only_free_ohlcv_p1_inputs
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import P2_V8_CONTRACT
          observed = datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00','Z')
          status, manifest, reason = 'PARKED', '', 'FREE_SOURCE_UNAVAILABLE'
          try:
              result = publish_tqqq_core_only_free_ohlcv_p1_inputs(TwelveYahooOhlcvObserver(os.environ.get('TWELVE_DATA_API_KEY','')), output_root=os.environ['ROOT'], observed_at=observed, date_cutoff=os.environ['DATE_CUTOFF'], producer={'repository':'QuantStrategyLab/UsEquitySnapshotPipelines','commit_sha':os.environ['GITHUB_SHA'],'tree_sha':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tool':'tqqq_core_only_free_ohlcv_p1','tool_version':'v1'})
              status, manifest, reason = 'ACCEPTED', result['manifest_sha256'], ''
          except TqqqCoreOnlyFreeOhlcvP1UnavailableError: pass
          except TqqqCoreOnlyFreeOhlcvP1Error: reason = 'FREE_SOURCE_CONTRACT_FAILURE'
          record={'schema_version':'qsl.tqqq-p2-v8-p1-manual-status.v1','candidate':{'candidate_id':P2_V8_CONTRACT.candidate_id,'config_sha256':P2_V8_CONTRACT.config_sha256},'date_cutoff':os.environ['DATE_CUTOFF'],'status':status,'reason_code':reason,'input_manifest_sha256':manifest}
          Path(os.environ['STATUS']).write_bytes(json.dumps(record,sort_keys=True,separators=(',',':')).encode())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f'status={status}\nmanifest_sha256={manifest}\n')
          PY
      - name: Create-only upload accepted private P1 root
        if: steps.p1.outputs.status == 'ACCEPTED'
        env:
          MANIFEST_SHA256: ${{ steps.p1.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v8-free-ohlcv/p1-root"; dest="gs://qsl-runtime-logs-shared/tqqq-p1-p3/${MANIFEST_SHA256}"
          gcloud storage ls "$dest/" >/dev/null 2>&1 && exit 1
          gcloud storage cp --quiet --no-clobber "$root/binding.json" "$root/bars.json" "$root/assurance.json" "$root/manifest.json" "$dest/" >/dev/null
      - name: Run offline V8 P3 after accepted P1
        if: steps.p1.outputs.status == 'ACCEPTED'
        env:
          MANDATE_RECEIPT_SHA256: ${{ steps.mandate.outputs.mandate_receipt_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v8-free-ohlcv/p1-root"; output="${RUNNER_TEMP}/tqqq-v8-free-ohlcv/p3-output"
          uv run --no-sync python scripts/run_tqqq_p3.py --snapshot-root "$root" --config config/tqqq_core_only_p2_v8_free_ohlcv_relative_benchmark.json --mandate-receipt-sha256 "$MANDATE_RECEIPT_SHA256" --output-dir "$output" > "${RUNNER_TEMP}/tqqq-v8-free-ohlcv/p3-result.json"
      - name: Upload sanitized terminal status only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tqqq-v8-free-ohlcv-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tqqq-v8-free-ohlcv/p1-status.json
            ${{ runner.temp }}/tqqq-v8-free-ohlcv/p3-result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Record lifecycle boundary
        if: always()
        run: echo 'P4_P5_P6=NOT_AUTHORIZED; AUTHORITY=RESEARCH_ONLY_NO_ORDER' >> "$GITHUB_STEP_SUMMARY"
