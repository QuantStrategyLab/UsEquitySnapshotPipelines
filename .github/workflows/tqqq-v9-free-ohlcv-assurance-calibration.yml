name: TQQQ V9 Free OHLCV Assurance Calibration

on:
  workflow_dispatch:
    inputs:
      date_cutoff:
        description: Optional completed XNYS session in YYYY-MM-DD form.
        required: false
        type: string
  # Tuesday through Saturday UTC: each run observes the previous completed
  # US session after both daily providers have had time to settle.
  schedule:
    - cron: "30 2 * * 2-6"

permissions:
  contents: read

concurrency:
  group: tqqq-v9-free-ohlcv-assurance-calibration
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Resolve completed V9 session cutoff
        id: binding
        env:
          REQUESTED_CUTOFF: ${{ inputs.date_cutoff || '' }}
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import os
          from datetime import UTC, datetime, timedelta
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import P2_V9_CONTRACT, _expected_xnys_sessions, build_tqqq_core_only_p1_binding_for_contract
          requested = os.environ.get("REQUESTED_CUTOFF", "").strip()
          cutoff = requested or _expected_xnys_sessions((datetime.now(UTC).date() - timedelta(days=1)).isoformat())[-1].isoformat()
          build_tqqq_core_only_p1_binding_for_contract(P2_V9_CONTRACT, date_cutoff=cutoff)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"date_cutoff={cutoff}\n")
          PY
      - name: Observe redacted source assurance only
        id: assurance
        env:
          DATE_CUTOFF: ${{ steps.binding.outputs.date_cutoff }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v9-free-ohlcv-assurance/p1-root"
          status="${RUNNER_TEMP}/tqqq-v9-free-ohlcv-assurance/p1-status.json"
          mkdir -p "$(dirname "$root")"
          ROOT="$root" STATUS="$status" uv run --no-sync python - <<'PY'
          import json, os, subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from scripts.acquire_tqqq_core_only_free_ohlcv_p1 import TwelveYahooOhlcvObserver
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_free_ohlcv_p1 import observe_tqqq_core_only_free_ohlcv_assurance
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import P2_V9_CONTRACT
          observed = datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          record = observe_tqqq_core_only_free_ohlcv_assurance(
              TwelveYahooOhlcvObserver(os.environ.get("TWELVE_DATA_API_KEY", "")),
              output_root=os.environ["ROOT"],
              observed_at=observed,
              date_cutoff=os.environ["DATE_CUTOFF"],
              producer={
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "commit_sha": os.environ["GITHUB_SHA"],
                  "tree_sha": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                  "tool": "tqqq_free_ohlcv_assurance_observation",
                  "tool_version": "v1",
              },
              contract=P2_V9_CONTRACT,
          )
          Path(os.environ["STATUS"]).write_bytes(json.dumps(record, sort_keys=True, separators=(",", ":")).encode())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"status={record['status']}\nreason_code={record['reason_code']}\n")
          PY
      - name: Record observation-only boundary
        run: |
          printf 'STATUS=%s\nREASON=%s\nDATE_CUTOFF=%s\nAUTHORITY=OBSERVATION_ONLY_NO_ORDER\n' \
            '${{ steps.assurance.outputs.status }}' \
            '${{ steps.assurance.outputs.reason_code }}' \
            '${{ steps.binding.outputs.date_cutoff }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted assurance observation only
        uses: actions/upload-artifact@v7
        with:
          name: tqqq-v9-free-ohlcv-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tqqq-v9-free-ohlcv-assurance/p1-status.json
          if-no-files-found: error
          retention-days: 45
