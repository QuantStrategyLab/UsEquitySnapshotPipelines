name: TQQQ V9 Free OHLCV Assurance Calibration

on:
  workflow_dispatch:
    inputs:
      date_cutoff:
        description: Optional completed XNYS session in YYYY-MM-DD form.
        required: false
        type: string
  # Tuesday through Saturday UTC: each run observes the previous completed
  # US session after both daily providers have had time to settle.
  schedule:
    - cron: "30 2 * * 2-6"

permissions:
  actions: read
  contents: read

concurrency:
  group: tqqq-v9-free-ohlcv-assurance-calibration
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Resolve completed V9 session cutoff
        id: binding
        env:
          REQUESTED_CUTOFF: ${{ inputs.date_cutoff || '' }}
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import os
          from datetime import UTC, datetime, timedelta
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import P2_V9_CONTRACT, _expected_xnys_sessions, build_tqqq_core_only_p1_binding_for_contract
          requested = os.environ.get("REQUESTED_CUTOFF", "").strip()
          cutoff = requested or _expected_xnys_sessions((datetime.now(UTC).date() - timedelta(days=1)).isoformat())[-1].isoformat()
          build_tqqq_core_only_p1_binding_for_contract(P2_V9_CONTRACT, date_cutoff=cutoff)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"date_cutoff={cutoff}\n")
          PY
      - name: Observe redacted T+0 T+1 T+2 source settlement only
        id: probes
        env:
          DATE_CUTOFF: ${{ steps.binding.outputs.date_cutoff }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          batch="${RUNNER_TEMP}/tqqq-v9-free-ohlcv-assurance/settlement-observations.json"
          mkdir -p "$(dirname "$batch")"
          BATCH="$batch" uv run --no-sync python - <<'PY'
          import json, os, time
          from datetime import UTC, datetime
          from pathlib import Path
          from scripts.acquire_tqqq_core_only_free_ohlcv_p1 import TwelveYahooOhlcvObserver
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_free_ohlcv_p1 import observe_tqqq_core_only_free_ohlcv_settlement
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import P2_V9_CONTRACT, _expected_xnys_sessions
          cutoffs = tuple(reversed(_expected_xnys_sessions(os.environ["DATE_CUTOFF"])[-3:]))
          observer = TwelveYahooOhlcvObserver(os.environ.get("TWELVE_DATA_API_KEY", ""))
          observations = []
          for age, cutoff in enumerate(cutoffs):
              # Two four-symbol Twelve Data probes use the free-tier minute window.
              # Start the final probe in a fresh window instead of treating its
              # rate-limit response as a market-data conclusion.
              if age == 2:
                  time.sleep(60)
              observations.append(
                  {
                      "age_sessions": age,
                      "observation": observe_tqqq_core_only_free_ohlcv_settlement(
                          observer,
                          observed_at=datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
                          date_cutoff=cutoff.isoformat(),
                          contract=P2_V9_CONTRACT,
                      ),
                  }
              )
          batch = {
              "schema_version": "qsl.tqqq-free-ohlcv-settlement-observation-batch.v1",
              "candidate": {"candidate_id": P2_V9_CONTRACT.candidate_id, "config_sha256": P2_V9_CONTRACT.config_sha256},
              "anchor_date_cutoff": os.environ["DATE_CUTOFF"],
              "collection_policy": {
                  "twelve_data_requests_before_rate_window_wait": 8,
                  "rate_window_wait_seconds_before_t_plus_2": 60,
              },
              "observations": observations,
              "no_order": True,
              "automatic_promotion": False,
          }
          Path(os.environ["BATCH"]).write_bytes(json.dumps(batch, sort_keys=True, separators=(",", ":")).encode())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              anchor = observations[0]["observation"]
              out.write(f"status={anchor['status']}\nreason_code={anchor['reason_code']}\n")
          PY
      - name: Download prior redacted settlement observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior_dir="${RUNNER_TEMP}/tqqq-v9-free-ohlcv-assurance/prior"
          mkdir -p "$prior_dir"
          count=0
          run_ids="$prior_dir/run-ids.txt"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tqqq-v9-free-ohlcv-assurance-calibration.yml/runs?status=success&per_page=10" --jq '.workflow_runs[] | .id' > "$run_ids"; then
            echo 'SETTLEMENT_HISTORY=UNAVAILABLE; using current observation only' >> "$GITHUB_STEP_SUMMARY"
            : > "$run_ids"
          fi
          while IFS= read -r run_id; do
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            if ! artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("tqqq-v9-free-ohlcv-assurance-"))) | .id' | head -n 1)"; then
              continue
            fi
            [ -n "$artifact_id" ] || continue
            archive="$prior_dir/$run_id.zip"
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" --output "$archive"; then
              continue
            fi
            if unzip -Z1 "$archive" | grep -qx 'settlement-observations.json'; then
              unzip -p "$archive" settlement-observations.json > "$prior_dir/$run_id.json"
              count=$((count + 1))
              [ "$count" -ge 2 ] && break
            fi
          done < "$run_ids"
      - name: Build redacted settlement tracks only
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v9-free-ohlcv-assurance"
          args=(--current "$root/settlement-observations.json")
          for prior in "$root"/prior/*.json; do
            [ -e "$prior" ] && args+=(--prior "$prior")
          done
          uv run --no-sync python scripts/build_tqqq_free_ohlcv_settlement_tracks.py "${args[@]}" --output "$root/settlement-tracks.json"
      - name: Record observation-only boundary
        run: |
          printf 'STATUS=%s\nREASON=%s\nDATE_CUTOFF=%s\nAUTHORITY=OBSERVATION_ONLY_NO_ORDER\n' \
            '${{ steps.probes.outputs.status }}' \
            '${{ steps.probes.outputs.reason_code }}' \
            '${{ steps.binding.outputs.date_cutoff }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted settlement observations only
        uses: actions/upload-artifact@v7
        with:
          name: tqqq-v9-free-ohlcv-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tqqq-v9-free-ohlcv-assurance/settlement-observations.json
            ${{ runner.temp }}/tqqq-v9-free-ohlcv-assurance/settlement-tracks.json
          if-no-files-found: error
          retention-days: 35
