name: TQQQ V7 P1-P3 Manual Research

on:
  workflow_dispatch:
    inputs:
      mandate_id:
        description: Checked-in, externally authorized non-live scope record ID
        required: true
        type: string

concurrency:
  group: tqqq-p2-v7-relative-benchmark-manual-research
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  p1:
    runs-on: ubuntu-latest
    environment: market-data-nonlive
    outputs:
      date_cutoff: ${{ steps.binding.outputs.date_cutoff }}
      manifest_sha256: ${{ steps.acquire.outputs.manifest_sha256 }}
      mandate_id: ${{ steps.mandate.outputs.mandate_id }}
      mandate_receipt_sha256: ${{ steps.mandate.outputs.mandate_receipt_sha256 }}
      status: ${{ steps.acquire.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Verify external non-live scope record before provider access
        id: mandate
        env:
          MANDATE_ID: ${{ inputs.mandate_id }}
        run: |
          set -euo pipefail
          mandate_result="$(uv run --no-sync python scripts/verify_tqqq_p1_p3_mandate.py \
            --mandates-root config/tqqq_p1_p3_mandates --mandate-id "$MANDATE_ID")"
          MANDATE_RESULT="$mandate_result" uv run --no-sync python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["MANDATE_RESULT"])
          if result.get("status") != "NONLIVE_SCOPE_RECORD_VERIFIED":
              raise SystemExit("non-live scope record verification failed")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"mandate_id={result['mandate_id']}\n")
              output.write(f"mandate_receipt_sha256={result['mandate_receipt_sha256']}\n")
          PY
          printf 'NONLIVE_SCOPE_RECORD_STATUS=VERIFIED\nP4_P5_P6=NOT_AUTHORIZED\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve the immutable v7 P1 identity
        id: binding
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime, timedelta

          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import (
              P2_V7_CONTRACT,
              _expected_xnys_sessions,
              build_tqqq_core_only_p1_binding_for_contract,
          )

          with open('config/tqqq_core_only_p2_v7_relative_benchmark.json', encoding='utf-8') as handle:
              candidate = json.load(handle)
          canonical = json.dumps(
              candidate, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False
          ).encode('utf-8')
          if hashlib.sha256(canonical).hexdigest() != P2_V7_CONTRACT.config_sha256:
              raise SystemExit('unexpected P2 v7 candidate policy')
          reference_day = datetime.now(UTC).date() - timedelta(days=1)
          cutoff = _expected_xnys_sessions(reference_day.isoformat())[-1].isoformat()
          build_tqqq_core_only_p1_binding_for_contract(P2_V7_CONTRACT, date_cutoff=cutoff)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'date_cutoff={cutoff}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('RESEARCH_POLICY=TQQQ_P2_V7_RELATIVE_BENCHMARK\n')
              summary.write(f'DATE_CUTOFF={cutoff}\n')
              summary.write('AUTHORITY=RESEARCH_ONLY_NO_ORDER\n')
          PY
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Acquire and verify one private P1 root
        id: acquire
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          DATE_CUTOFF: ${{ steps.binding.outputs.date_cutoff }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v7-manual-research/p1-root"
          status_path="${RUNNER_TEMP}/tqqq-v7-manual-research/p1-status.json"
          mkdir -p "$(dirname "$root")"
          ROOT="$root" STATUS_PATH="$status_path" uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts.acquire_tqqq_core_only_p1_inputs_alpaca import (
              AlpacaSipHistoricalBarsProvider,
              AlpacaSipHttpTransport,
              P1InputUnavailableError,
              publish_tqqq_core_only_p1_inputs_for_contract,
          )
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import (
              P2_V7_CONTRACT,
              TqqqCoreOnlyP1BindingError,
          )
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_data_health import (
              assess_tqqq_core_only_p1_input_health,
              build_tqqq_core_only_p1_input_unavailable_health,
          )

          cutoff = os.environ['DATE_CUTOFF']
          observed_at = datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          status = 'PARKED'
          reason_code = 'INPUT_UNAVAILABLE'
          manifest_sha256 = ''
          try:
              transport = AlpacaSipHttpTransport(
                  os.environ['ALPACA_API_KEY_ID'], os.environ['ALPACA_API_SECRET_KEY']
              )
              provider = AlpacaSipHistoricalBarsProvider(transport, date_cutoff=cutoff)
              published = publish_tqqq_core_only_p1_inputs_for_contract(
                  provider,
                  output_root=os.environ['ROOT'],
                  observed_at=observed_at,
                  producer={
                      'repository': 'QuantStrategyLab/UsEquitySnapshotPipelines',
                      'commit_sha': os.environ['GITHUB_SHA'],
                      'tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                      'tool': 'tqqq_core_only_p1_alpaca_sip_acquisition',
                      'tool_version': 'v1',
                  },
                  contract=P2_V7_CONTRACT,
                  date_cutoff=cutoff,
              )
              payload = json.loads((Path(os.environ['ROOT']) / 'bars.json').read_bytes())
              health = assess_tqqq_core_only_p1_input_health(
                  payload, observed_at=observed_at, contract=P2_V7_CONTRACT, date_cutoff=cutoff
              )
              if health['status'] == 'ACCEPTED':
                  status = 'ACCEPTED'
                  reason_code = ''
                  manifest_sha256 = published['manifest_sha256']
              else:
                  reason_code = 'P1_HEALTH_' + str(health['status'])
          except P1InputUnavailableError as exc:
              health = build_tqqq_core_only_p1_input_unavailable_health(
                  observed_at=observed_at, contract=P2_V7_CONTRACT, date_cutoff=cutoff
              )
              reason_code = exc.reason_code
          except TqqqCoreOnlyP1BindingError:
              health = {'status': 'QUARANTINED', 'verdict': 'REJECTED', 'reason_codes': ['P1_CONTRACT_FAILURE']}
              reason_code = 'P1_CONTRACT_FAILURE'
          record = {
              'schema_version': 'qsl.tqqq-p2-v7-p1-manual-status.v1',
              'candidate': {'candidate_id': P2_V7_CONTRACT.candidate_id, 'config_sha256': P2_V7_CONTRACT.config_sha256},
              'date_cutoff': cutoff,
              'status': status,
              'reason_code': reason_code,
              'input_manifest_sha256': manifest_sha256,
              'p1_health_sha256': hashlib.sha256(json.dumps(health, sort_keys=True, separators=(',', ':')).encode()).hexdigest(),
          }
          path = Path(os.environ['STATUS_PATH'])
          path.write_bytes(json.dumps(record, sort_keys=True, separators=(',', ':')).encode())
          path.chmod(0o600)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'status={status}\n')
              if manifest_sha256:
                  output.write(f'manifest_sha256={manifest_sha256}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'P1_STATUS={status}\n')
              summary.write(f'P1_REASON_CODE={reason_code or "NONE"}\n')
          PY
      - name: Create-only upload of an accepted P1 root
        if: steps.acquire.outputs.status == 'ACCEPTED'
        env:
          MANIFEST_SHA256: ${{ steps.acquire.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v7-manual-research/p1-root"
          destination="gs://qsl-runtime-logs-shared/tqqq-p1-p3/${MANIFEST_SHA256}"
          if gcloud storage ls "${destination}/" >/dev/null 2>&1; then
            exit 1
          fi
          gcloud storage cp --quiet --no-clobber "$root/binding.json" "$root/bars.json" "$root/manifest.json" "${destination}/" >/dev/null
      - name: Upload sanitized P1 status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tqqq-v7-p1-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tqqq-v7-manual-research/p1-status.json
          if-no-files-found: error
          retention-days: 35

  p3:
    needs: p1
    if: needs.p1.outputs.status == 'ACCEPTED'
    runs-on: ubuntu-latest
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Re-verify external non-live scope record
        env:
          MANDATE_ID: ${{ needs.p1.outputs.mandate_id }}
          EXPECTED_RECEIPT: ${{ needs.p1.outputs.mandate_receipt_sha256 }}
        run: |
          set -euo pipefail
          mandate_result="$(uv run --no-sync python scripts/verify_tqqq_p1_p3_mandate.py \
            --mandates-root config/tqqq_p1_p3_mandates --mandate-id "$MANDATE_ID")"
          MANDATE_RESULT="$mandate_result" EXPECTED_RECEIPT="$EXPECTED_RECEIPT" uv run --no-sync python - <<'PY'
          import json
          import os
          result = json.loads(os.environ['MANDATE_RESULT'])
          if result.get('status') != 'NONLIVE_SCOPE_RECORD_VERIFIED' or result.get('mandate_receipt_sha256') != os.environ['EXPECTED_RECEIPT']:
              raise SystemExit('non-live scope record verification failed')
          PY
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Download and verify the candidate-bound P1 root
        env:
          MANIFEST_SHA256: ${{ needs.p1.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v7-manual-research/p3-input"
          mkdir -p "$root"
          chmod 700 "$root"
          source="gs://qsl-runtime-logs-shared/tqqq-p1-p3/${MANIFEST_SHA256}"
          gcloud storage cp --quiet "$source/binding.json" "$source/bars.json" "$source/manifest.json" "$root/" >/dev/null
          ROOT="$root" uv run --no-sync python - <<'PY'
          import os
          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import P2_V7_CONTRACT, verify_tqqq_core_only_input_root
          verify_tqqq_core_only_input_root(os.environ['ROOT'], contract=P2_V7_CONTRACT)
          PY
      - name: Run offline v7 P3 and write only sanitized evidence metadata
        env:
          MANIFEST_SHA256: ${{ needs.p1.outputs.manifest_sha256 }}
          MANDATE_ID: ${{ needs.p1.outputs.mandate_id }}
          MANDATE_RECEIPT_SHA256: ${{ needs.p1.outputs.mandate_receipt_sha256 }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tqqq-v7-manual-research/p3-input"
          result_path="${RUNNER_TEMP}/tqqq-v7-manual-research/p3-result.json"
          status_path="${RUNNER_TEMP}/tqqq-v7-manual-research/p3-status.json"
          output_root="${RUNNER_TEMP}/tqqq-v7-manual-research/p3-output"
          exit_code=0
          uv run --no-sync python scripts/run_tqqq_p3.py \
            --snapshot-root "$root" \
            --config config/tqqq_core_only_p2_v7_relative_benchmark.json \
            --mandate-receipt-sha256 "$MANDATE_RECEIPT_SHA256" \
            --output-dir "$output_root" > "$result_path" || exit_code=$?
          RESULT_PATH="$result_path" STATUS_PATH="$status_path" SNAPSHOT_ROOT="$root" EXIT_CODE="$exit_code" uv run --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          from us_equity_snapshot_pipelines.lifecycle.tqqq_core_only_p1_binding import P2_V7_CONTRACT
          from us_equity_snapshot_pipelines.lifecycle.tqqq_p3_v7_evidence_index import (
              build_tqqq_p3_v7_evidence_index,
              canonical_tqqq_p3_v7_evidence_index_bytes,
              validate_tqqq_p3_v7_result,
          )

          result = json.loads(Path(os.environ['RESULT_PATH']).read_text(encoding='utf-8'))
          completed = os.environ['EXIT_CODE'] == '0'
          if completed:
              terminal = validate_tqqq_p3_v7_result(result)
          else:
              expected = {'complete_evidence', 'failure_class', 'replay_started', 'source_commit', 'stage', 'status'}
              if set(result) != expected or result.get('status') != 'PARKED' or result.get('complete_evidence') is not False:
                  raise SystemExit('invalid sanitized P3 failure')
              terminal = result
          record = {
              'schema_version': 'qsl.tqqq-p2-v7-p3-manual-status.v1',
              'candidate': {'candidate_id': P2_V7_CONTRACT.candidate_id, 'config_sha256': P2_V7_CONTRACT.config_sha256},
              'input_manifest_sha256': os.environ['MANIFEST_SHA256'],
              'p3_terminal': terminal,
              'authority_scope': 'RESEARCH_ONLY',
              'automatic_promotion': False,
              'no_order': True,
          }
          if completed:
              manifest = json.loads((Path(os.environ['SNAPSHOT_ROOT']) / 'manifest.json').read_text())
              index = build_tqqq_p3_v7_evidence_index(
                  p1_manifest_sha256=os.environ['MANIFEST_SHA256'],
                  nonlive_scope_record={'mandate_id': os.environ['MANDATE_ID'], 'receipt_sha256': os.environ['MANDATE_RECEIPT_SHA256']},
                  p3_result=terminal,
                  input_producer=manifest['producer'],
                  producer={
                      'repository': os.environ['GITHUB_REPOSITORY'],
                      'commit_sha': os.environ['GITHUB_SHA'],
                      'tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                      'tool': 'tqqq_p1_p3_v7_nonlive_evidence_index',
                      'tool_version': 'v1',
                      'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                      'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  },
              )
              index_path = Path(os.environ['STATUS_PATH']).with_name('p3-evidence-index.json')
              index_path.write_bytes(canonical_tqqq_p3_v7_evidence_index_bytes(index))
              index_path.chmod(0o600)
              record['p3_evidence_index_sha256'] = __import__('hashlib').sha256(index_path.read_bytes()).hexdigest()
          path = Path(os.environ['STATUS_PATH'])
          path.write_bytes(json.dumps(record, sort_keys=True, separators=(',', ':')).encode())
          path.chmod(0o600)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"P3_STATUS={terminal['status']}\n")
              summary.write('P4_P5_P6=NOT_AUTHORIZED\n')
          PY
      - name: Create-only upload of sanitized P3 metadata
        if: always()
        env:
          MANIFEST_SHA256: ${{ needs.p1.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          status_path="${RUNNER_TEMP}/tqqq-v7-manual-research/p3-status.json"
          destination="gs://qsl-runtime-logs-shared/tqqq-p1-p3/${MANIFEST_SHA256}"
          gcloud storage cp --quiet --no-clobber "$status_path" "${destination}/tqqq-v7-p3-status.json" >/dev/null
          index_path="${RUNNER_TEMP}/tqqq-v7-manual-research/p3-evidence-index.json"
          if [ -f "$index_path" ]; then
            gcloud storage cp --quiet --no-clobber "$index_path" "${destination}/tqqq-v7-p3-evidence-index.json" >/dev/null
          fi
      - name: Upload sanitized P3 metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tqqq-v7-p3-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tqqq-v7-manual-research/p3-status.json
            ${{ runner.temp }}/tqqq-v7-manual-research/p3-evidence-index.json
          if-no-files-found: warn
          retention-days: 35
