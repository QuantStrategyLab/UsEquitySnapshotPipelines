name: SOXL V5 Long-Term Drawdown P1-P3 Research

on:
  workflow_dispatch:
    inputs:
      date_cutoff:
        description: Exact completed XNYS session (YYYY-MM-DD) for the v5 research input.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: soxl-v5-longterm-drawdown-p1-p3
  cancel-in-progress: false

jobs:
  p1-p3-research:
    runs-on: ubuntu-latest
    # Market data only: this workflow has no broker, deployment, cloud storage,
    # artifact-upload, or automatic-promotion permission.
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked research runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
      - name: Build one assured v5 P1 root or park
        id: p1
        env:
          DATE_CUTOFF: ${{ inputs.date_cutoff }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/soxl-v5-longterm-drawdown/p1-root"
          mkdir -p "$(dirname "$root")"
          ROOT="$root" uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts.acquire_soxl_core_only_free_split_close_p1 import TwelveYahooSplitAdjustedCloseObserver
          from us_equity_snapshot_pipelines.lifecycle.soxl_core_only_free_split_close_p1 import (
              SoxlCoreOnlyFreeSplitCloseP1Error,
              SoxlCoreOnlyFreeSplitCloseP1UnavailableError,
              publish_soxl_core_only_free_split_close_p1_inputs,
          )
          from us_equity_snapshot_pipelines.lifecycle.soxl_core_only_p2_v5_longterm_drawdown_contract import (
              P2_V5_LONGTERM_DRAWDOWN_CONTRACT,
          )

          root = Path(os.environ['ROOT'])
          observed_at = datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          result = {
              'status': 'PARKED',
              'reason': 'P1_CONTRACT_OR_SOURCE_UNAVAILABLE',
              'reason_code': 'FREE_SOURCE_ASSURANCE_NOT_VERIFIED',
          }
          try:
              published = publish_soxl_core_only_free_split_close_p1_inputs(
                  TwelveYahooSplitAdjustedCloseObserver(os.environ.get('TWELVE_DATA_API_KEY', '')),
                  output_root=root,
                  observed_at=observed_at,
                  producer={
                      'repository': 'QuantStrategyLab/UsEquitySnapshotPipelines',
                      'commit_sha': os.environ['GITHUB_SHA'],
                      'tree_sha': subprocess.check_output(
                          ['git', 'rev-parse', 'HEAD^{tree}'], text=True
                      ).strip(),
                      'tool': 'soxl_core_only_v5_longterm_drawdown_p1',
                      'tool_version': 'v5',
                  },
                  date_cutoff=os.environ['DATE_CUTOFF'],
                  p2_contract=P2_V5_LONGTERM_DRAWDOWN_CONTRACT,
              )
              result = {
                  'status': 'ACCEPTED',
                  'manifest_sha256': published['manifest_sha256'],
                  'candidate_id': P2_V5_LONGTERM_DRAWDOWN_CONTRACT.candidate_id,
                  'reason_code': '',
              }
          except SoxlCoreOnlyFreeSplitCloseP1UnavailableError as exc:
              result['reason_code'] = exc.reason_code
          except SoxlCoreOnlyFreeSplitCloseP1Error:
              pass
          encoded = json.dumps(result, sort_keys=True, separators=(',', ':')).encode('utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"status={result['status']}\n")
              output.write(f"manifest_sha256={result.get('manifest_sha256', '')}\n")
              output.write(f"reason_code={result['reason_code']}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(f"SOXL_V5_P1_STATUS={result['status']}\n")
              output.write(f"SOXL_V5_P1_TERMINAL_SHA256={hashlib.sha256(encoded).hexdigest()}\n")
              output.write(f"SOXL_V5_P1_REASON_CODE={result['reason_code']}\n")
              if result.get('manifest_sha256'):
                  output.write(f"SOXL_V5_P1_MANIFEST_SHA256={result['manifest_sha256']}\n")
          print('SOXL_V5_P1_TERMINAL=' + encoded.decode('utf-8'))
          PY
      - name: Run v5 offline P3 evidence after accepted P1
        if: steps.p1.outputs.status == 'ACCEPTED'
        id: p3
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/soxl-v5-longterm-drawdown/p1-root"
          ues="${RUNNER_TEMP}/soxl-v5-longterm-drawdown/ues"
          summary="${RUNNER_TEMP}/soxl-v5-longterm-drawdown/p3-summary.json"
          git clone --quiet --no-checkout https://github.com/QuantStrategyLab/UsEquityStrategies.git "$ues"
          git -C "$ues" fetch --quiet --depth=1 origin be692f75f64557e68edbff93786781e26c4f5893
          git -C "$ues" checkout --quiet --detach be692f75f64557e68edbff93786781e26c4f5893
          uv run --no-sync python scripts/run_soxl_core_only_free_split_close_p3_evidence.py \
            --p1-binding "$root/binding.json" \
            --input-manifest "$root/manifest.json" \
            --closes-member "$root/closes.json" \
            --assurance-member "$root/assurance.json" \
            --ues-project "$ues" \
            --p2-candidate config/soxl_soxx_core_only_p2_v5_longterm_drawdown.json \
            --p2-profile v5_longterm_drawdown > "$summary"
          SUMMARY="$summary" uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ['SUMMARY']).read_bytes())
          if result.get('status') == 'SUCCESS' and isinstance(result.get('evidence_summary_sha256'), str):
              runs = result.get('runs')
              gate = result.get('longterm_compounding_gate')
              if not isinstance(runs, list) or len(runs) != 12 or not isinstance(gate, dict):
                  raise SystemExit('invalid sanitized SOXL v5 P3 run count')
              review_runs = []
              for run in runs:
                  if not isinstance(run, dict):
                      raise SystemExit('invalid sanitized SOXL v5 P3 run')
                  metrics = run.get('metrics')
                  benchmark = run.get('benchmark')
                  run_gate = run.get('longterm_compounding_gate')
                  if not isinstance(metrics, dict) or not isinstance(benchmark, dict) or not isinstance(run_gate, dict):
                      raise SystemExit('invalid sanitized SOXL v5 P3 metrics')
                  fields = ('net_return', 'max_drawdown', 'sharpe', 'cagr', 'calmar', 'win_rate', 'cost_total')
                  if not all(isinstance(metrics.get(field), (int, float)) for field in fields):
                      raise SystemExit('invalid sanitized SOXL v5 strategy metrics')
                  if not all(isinstance(benchmark.get(field), (int, float)) for field in fields[:-1]):
                      raise SystemExit('invalid sanitized SOXL v5 benchmark metrics')
                  if not all(isinstance(run_gate.get(field), bool) for field in (
                      'max_drawdown_not_exceeding_benchmark',
                      'incremental_calmar_after_cost',
                      'passed',
                  )):
                      raise SystemExit('invalid sanitized SOXL v5 acceptance gate')
                  review_runs.append({
                      'window_id': run.get('window_id'),
                      'window_kind': run.get('window_kind'),
                      'cost_bps': run.get('cost_bps'),
                      'metrics': {field: metrics[field] for field in fields},
                      'benchmark': {
                          'benchmark_symbol': benchmark.get('benchmark_symbol'),
                          'max_drawdown': benchmark['max_drawdown'],
                          'calmar': benchmark['calmar'],
                      },
                      'longterm_compounding_gate': run_gate,
                  })
              status = 'SUCCESS'
              evidence_sha256 = result['evidence_summary_sha256']
              strategy_verdict = (
                  'PASS_REQUIRES_SEPARATE_HUMAN_PROMOTION'
                  if gate.get('all_fixed_folds_and_cost_scenarios_passed') is True
                  else 'REJECT_NEGATIVE_STRATEGY_EVIDENCE'
              )
              review = {
                  'evidence_status': 'EVIDENCE_COMPLETE',
                  'strategy_verdict': strategy_verdict,
                  'evidence_summary_sha256': evidence_sha256,
                  'longterm_compounding_gate': gate,
                  'runs': review_runs,
              }
          elif set(result) == {'schema_version', 'status', 'failure_class'} and result['status'] == 'PARKED':
              status = 'PARKED'
              evidence_sha256 = ''
              strategy_verdict = 'INCONCLUSIVE_DATA_OR_EXECUTION'
              review = {
                  'evidence_status': status,
                  'strategy_verdict': strategy_verdict,
                  'failure_class': result['failure_class'],
              }
          else:
              raise SystemExit('invalid sanitized SOXL v5 P3 terminal result')
          encoded_review = json.dumps(review, sort_keys=True, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'status={status}\n')
              output.write(f'strategy_verdict={strategy_verdict}\n')
              output.write(f'evidence_summary_sha256={evidence_sha256}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(f'SOXL_V5_P3_EVIDENCE_STATUS={"EVIDENCE_COMPLETE" if status == "SUCCESS" else status}\n')
              output.write(f'SOXL_V5_P3_STRATEGY_VERDICT={strategy_verdict}\n')
              if evidence_sha256:
                  output.write(f'SOXL_V5_P3_EVIDENCE_SUMMARY_SHA256={evidence_sha256}\n')
              else:
                  output.write(f"SOXL_V5_P3_FAILURE_CLASS={result['failure_class']}\n")
          print('SOXL_V5_P3_REVIEW=' + encoded_review)
          PY
      - name: Record parked P3 when P1 is not admitted
        if: steps.p1.outputs.status != 'ACCEPTED'
        run: echo 'SOXL_V5_P3_STATUS=PARKED' >> "$GITHUB_STEP_SUMMARY"
