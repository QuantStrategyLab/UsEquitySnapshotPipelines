name: R3-v2 Price-Only Assurance Diagnostic

on:
  workflow_dispatch:
    inputs:
      date_cutoff:
        description: Exact YYYY-MM-DD completed XNYS cutoff for QQQ/TQQQ/SOXX/SOXL price-only (OHLC) assurance.
        required: true
        type: string

permissions:
  contents: read

jobs:
  assess-r3-v2-price-only:
    runs-on: ubuntu-latest
    # Market-data-only key may be present. No cloud identity, artifact upload,
    # account, or order access. Independent from full-OHLCV R3-v2 contract.
    environment: market-data-nonlive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Diagnose R3-v2 price-only assurance without publishing
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          DATE_CUTOFF: ${{ inputs.date_cutoff }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
          env -u UV_PYTHON -u VIRTUAL_ENV uv run --no-sync python scripts/diagnose_r3_v2_price_only_assurance.py \
            --date-cutoff "$DATE_CUTOFF" | tee -a "$GITHUB_STEP_SUMMARY"
